# Shared `training:` block for the Qwen3.5 RLVR/debate pair — the same role
# _olmo_training.yaml plays for the OLMo pair, and written under the same
# constraints:
#
#   * Only `training:`. Never `protocol:` — deep_merge merges lists BY INDEX,
#     so a shared protocol block would silently corrupt turn definitions.
#   * Never experiment-level keys — `training:` is the only block a debate
#     experiment and an RLVR experiment parse the same way. `model`,
#     `enable_thinking`, `think_tokens` and `max_completion_tokens` are
#     RLVR-only and run_debate's EXPERIMENT_KEYS rejects them outright.
#
# Why this file exists: the two arms are supposed to differ ONLY in the
# protocol and reward channel, but they were maintained as independent copies
# and had drifted on 23 training keys. What must match now lives here, in one
# place, so a change to the objective cannot land on one arm and miss the
# other.
#
# This file holds ONLY keys the two arms genuinely agree on today. Divergent
# values are deliberately NOT parked here behind per-arm overrides — that
# would look unified while changing nothing, and would make "delete the
# override" a silent behaviour change. They are listed below instead, and each
# is commented at its site in the arm that sets it.
#
# ---------------------------------------------------------------------------
# DIVERGENCES between mathl5_qwen35_cispo (RLVR) and
# mathl5_qwen35_pc_debate_cispo_verl (debate).
#
#   SHARED BELOW — the arms agreed, or were made to agree (Ethan, 2026-08-22:
#   "change everything in debate to fit RLVR except keep steps at 100"):
#     loss, kl_coef, adv_length_norm, lr, lr_schedule, min_lr_ratio,
#     warmup_steps, group_size, eval_n, eval_every, eval_max_tokens,
#     eval_split, save_every
#
#   DELIBERATELY DIFFERENT:
#     steps          200 (RLVR) vs 100 (debate) — held at 100 by decision.
#                    Note the cosine schedule is indexed to cfg.steps, so the
#                    debate arm decays to min_lr_ratio over 100 steps rather
#                    than 200: same shape, compressed. warmup_steps 10 is 10%
#                    of the debate run against 5% of the RLVR run.
#
#   MATCHED, BUT DECLARED AT BOTH SITES — experiment-level keys, which this
#   file (a `training:` block) cannot carry:
#     eval_dataset   amc + math_nocot + think_overshoot_penalty 0.1 on both
#                    arms. Parking it here would ADD a declaration rather than
#                    replace one: _qwen35_l5 must keep its own for the arms
#                    that never extend this base (mathl5_qwen35_dapo), and a
#                    later parent would then silently win for some arms and
#                    not others. One declaration per arm, pinned equal by
#                    tests/test_debate_eval_pool.py.
#     eval budget    RLVR: think_tokens 4000 + max_completion_tokens 1024.
#                    Debate: eval_slot_limits {4000, 5024} — protocol slot
#                    budgets never reach an eval env, so the debate arm states
#                    the same caps directly. Same test pins the pair.
#     dataset.prompt_file
#                    math_nocot.yaml on both arms: the debate proposal slot
#                    renders the task source's ANSWER_GEN_USER, so this is the
#                    rollout prompt for both.
#
#   STILL DIFFERENT — dataset.think_overshoot_penalty is 0.1 on the RLVR train
#   pool and 0.0 on the debate one. It prices the reward the arms are supposed
#   to differ in, so it is not folded in here.
#
#   PROTOCOL-FORCED — documented at their sites, leave alone:
#     verl.n_gpus, verl.rollout_tp, verl.strategy,
#     verl.gpu_memory_utilization (judge reserves ~0.18 on its own vLLM),
#     verl.prompt_length, verl.response_length (debate's slot caps),
#     kl_discount_factor, ppo_epochs
# ---------------------------------------------------------------------------

_qwen35_train_base:
  training:
    backend: verl

    # ---- the objective ----------------------------------------------------
    # This is what the debate/RLVR comparison holds fixed: same loss, same
    # clipping, same KL penalty. A change here must move both arms, or the
    # comparison stops meaning anything. That is the whole point of the file.
    loss: {kind: cispo, clip_low: 0.8, clip_high: 1.28}
    kl_coef: 0.02        # centered-k1 advantage penalty vs frozen base
    # verl aggregates token-mean; datum/trajectory divide by length twice
    adv_length_norm: none

    # ---- optimizer ----------------------------------------------------------
    # The debate arm ran 1e-5 with no schedule and no warmup for a long time.
    # That was the largest unexplained gap between the arms and is now closed:
    # both run the RLVR lineage's optimizer.
    lr: 1.0e-4
    lr_schedule: cosine
    min_lr_ratio: 0.2
    warmup_steps: 10

    # ---- sampling -----------------------------------------------------------
    # Rollouts per prompt. Both arms use 8. The debate arm ran 4 for a while
    # and it cost signal, not just time: with solution_correct around 0.8 a
    # group of 4 is often unanimous, and a unanimous group has zero advantage
    # and is dropped. A live run at step 36 dropped 60 of 68 datums that way.
    group_size: 8

    # ---- evaluation ---------------------------------------------------------
    # 256, not 32. At p=0.4 an n=32 eval has a standard error of +/-0.087, so a
    # live debate run's eval read 0.438 -> 0.219 -> 0.469 -> 0.406 across 40
    # steps: a range entirely explicable as noise. An eval that cannot separate
    # a working run from a broken one is not worth the GPU time it costs.
    eval_n: 256
    eval_every: 10
    eval_max_tokens: 5120
    eval_split: dev
    save_every: 10

    # ---- wandb -------------------------------------------------------------
    # The TEAM, not the api key's personal default entity — without this, runs
    # land in whoever launched them's own namespace and the rest of the team
    # cannot see them.
    wandb_entity: palaestra-research
