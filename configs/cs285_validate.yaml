# Infra-validation arms (Ethan, 2026-08-11): reproduce Berkeley CS185/285
# HW4's KNOWN-WORKING math_hard + GRPO run inside OUR stack, hyperparameters
# verbatim from the assignment's Required Run 4 (hw4.pdf §7.4) and the local
# reference implementation (~/code/cs285_sp26/hw4). If our GRPO matches the
# published trajectory (baseline eval ~0.26; final train reward >0.55, final
# eval >0.37 at 501 steps; debug floor 0.35), the training loop, rewards,
# advantages, and eval plumbing are validated end to end. The CISPO twin
# changes ONLY the loss, so any separation is the algorithm, not the infra.
#
# Reference alignment:
#   model            Qwen/Qwen2.5-Math-1.5B-Instruct, LoRA r16/alpha32 (hw4
#                    trains an adapter, not full FT)
#   task             hendrycks MATH level-5 train, deterministic 512-row eval
#   prompt           math_hw4.yaml (starter's _build_messages, verbatim)
#   rewards          1.0 correct + 0.1 boxed + 0.1 relaxed (MathEnv defaults)
#   sampling         temperature 0.8, top_p 0.95 (exp-level keys)
#   loss             GRPO = ppo clip 0.2 symmetric; 2 ppo epochs; kl 0.05
#   optimizer        AdamW; weight_decay 0 and grad clip 0.5 via
#                    extra_overrides; linear warmup 100 steps via the
#                    warmup_steps training key (loop-level)
#   adv_length_norm  none — per-completion averaging lives in
#                    loss_agg_mode=seq-mean-token-mean
# Known deviations (accepted; audit rounds 2-4, 2026-08-11):
#   - hardware B200 not H100 (speed only)
#   - prompt_length 1536 no-truncate vs their train-side 512 left-truncate
#     (eval side matches exactly: hw4 evals uncapped)
#   - LoRA dropout 0 vs their 0.05 (verl's LoRA path exposes no dropout)
#   - hw4 samples under model.eval() so its epoch-1 ratios are not exactly 1;
#     ours are exactly 1 by construction (tempered re-anchor)
#   - verl tempers the training-side logprobs (logits/T), so epoch-2 ratios
#     run ~1.25x theirs for the same weight change (clip fires a bit earlier)
#   - our eval points land one update after hw4's same-labeled points
#   - the in-loss KL runs between TEMPERED logprob pairs (logits/T both
#     sides), so its effective strength is ~1/T^2 = 1.56x hw4's raw-logit
#     k3 at T=0.8; verl also aggregates the KL with loss_agg_mode (row-
#     weighted) where hw4 uses a global token-mean, and clamps kld to
#     [-10, 10] (gradient zeroed past delta ~2.6). Compound effect ~1.3-1.9x
#     their pull — watch loss/kl_loss; drop kl_coef toward 0.032 only if it
#     runs hot vs the reference curve.
cs285_mathhard_grpo:
  model: Qwen/Qwen2.5-Math-1.5B-Instruct
  temperature: 0.8
  top_p: 0.95
  max_completion_tokens: 512
  min_completion_tokens: 8     # hw4 run script's --min_new_tokens 8
  dataset: {type: math, levels: 5, seed: 0, prompt_file: infra/prompts/tasks/math_hw4.yaml}
  training:
    backend: verl
    verl:
      # n_gpus / rollout_tp / gpu_memory_utilization come from the 1xB200
      # topology entry (configs/topologies.yaml).
      # NOT 768: the level-5 pools carry a 1397-token max rendered prompt
      # (31 train rows / 3 eval rows above 512). hw4 left-truncates in
      # training and applies NO cap at eval; our guard hard-errors instead,
      # so 768 dies deterministically at the step-0 eval. 1536 covers the
      # longest row — eval matches hw4 exactly; the 31 truncated-by-them
      # train rows we keep whole (diff-sample audit, 2026-08-11).
      prompt_length: 1536
      response_length: 512
      max_token_len_per_gpu: 8192
      checkpoint_dir: /workspace/checkpoints
      extra_overrides:
        # clip_grad, not actor.grad_clip: the FSDP engine clips with
        # optimizer_config.clip_grad; actor.grad_clip is a dead key on this
        # path (diff-algo audit, 2026-08-11). appended last -> wins over the
        # backend's emitted clip_grad=1.0.
        - "++actor_rollout_ref.actor.optim.clip_grad=0.5"
        - "++actor_rollout_ref.actor.optim.weight_decay=0.0"
        # hw4 averages per completion then across the batch. seq-mean-token-mean
        # + adv_length_norm none reproduces that exactly (global_batch_size=64);
        # our default token-mean + datum matched the gradient DIRECTION but ran
        # ~350x smaller, which grad clipping does not survive.
        - "++actor_rollout_ref.actor.loss_agg_mode=seq-mean-token-mean"
    wandb_entity: palaestra-research
    wandb_project: debate-math
    # LoRA r=16 / alpha=32, dropout aside, matching hw4's
    # load_lora_policy_model_and_tokenizer (train.py:530, config.py:43-47) —
    # NOT full FT (earlier comment here was wrong). lr 3e-5 is an adapter
    # rate; full-FT at that lr would collapse. Our backend emits
    # lora_alpha = 2*rank = 32, matching. Also: kl_coef > 0 REQUIRES LoRA on
    # our verl path (ref_logprobs raises without it).
    lora_rank: 16
    loss: {kind: ppo, clip_low: 0.8, clip_high: 1.2}
    ppo_epochs: 2
    # micro_batch is load-bearing beyond step count: _pack stamps
    # global_batch_size per forward_backward CALL, so a smaller micro_batch
    # would normalize each call over its own rows and multiply the
    # effective lr by 64/micro_batch.
    micro_batch: 64
    warmup_steps: 100            # linear 0->lr over 100 steps (hw4 default)
    adv_length_norm: none        # length weighting now lives in loss_agg_mode
    adv_population_std: true     # hw4 std(unbiased=False); default is verl parity
    drop_zero_advantage: false   # hw4 keeps all 64 rows in the seq-mean denominator
    # hw4's KL is a DIFFERENTIABLE in-loss k3 vs the frozen ref, recomputed
    # each minibatch — not our advantage-space centered k1 (which has zero
    # net pull). kl_mechanism loss routes kl_coef into verl's native
    # use_kl_loss/kl_loss_coef/low_var_kl.
    kl_mechanism: loss
    steps: 501
    batch_size: 8
    group_size: 8
    lr: 3.0e-5
    kl_coef: 0.05
    kl_discount_factor: 0.0
    eval_every: 100
    eval_n: 512
    eval_max_tokens: 512
    save_every: 100

# Same run, CISPO loss (asymmetric DAPO-style bounds, our campaign setting).
# Everything else identical — the controlled algorithm comparison Ethan asked
# for ("see if our choice of algorithm also works").
cs285_mathhard_cispo:
  _extends: cs285_mathhard_grpo
  training:
    loss: {kind: cispo, clip_low: 0.8, clip_high: 1.28}


# Debate-reward twin of cs285_mathhard_cispo (Ethan, 2026-08-11). Keep the
# validated policy/optimizer/task recipe and replace direct verifier reward
# with the existing competitive proposer-critic environment. The opening is
# deliberately a direct solution turn (no extra plan): DebateEnv splices the
# task family's answer-generation message into `proposal`, so the policy's
# initial answer and the direct held-out eval share one approved prompt and a
# 512-token shape. The three later speeches are the additional intervention.
#
# Intentional differences from cs285_mathhard_cispo:
#   - the existing math debate/RLVR prompt replaces HW4's answer-only prompt:
#     the critic needs an inspectable derivation, while HW4 explicitly bans
#     prose. Absolute step-0 accuracy therefore is not a strict twin; compare
#     learning dynamics and gains instead
#   - trained sampling is 1.0/1.0, a DebateEnv invariant: raw sampler
#     logprobs anchor CISPO, so tempered/truncated sampling would corrupt the
#     ratio (the RLVR runner has a recompute seam that DebateEnv forbids)
#   - reward is continuous competitive judge confidence (+ the same 0.1
#     strict-boxed proposal shaping), not MathEnv correctness
#   - four trained 512-token speech slots per debate; prompt_length 6144
#     covers the cumulative transcript without silent engine truncation
# Everything under `training` otherwise mirrors the validated CISPO arm.
# Run (1xB200):
#   CONFIG=configs/cs285_validate.yaml bash scripts/pod_run.sh debate cs285_mathhard_debate_cispo
cs285_mathhard_debate_cispo:
  protocol:
    turns:
      - alice: [{name: proposal, kind: solution, max_total_tokens: 512}]
      - bob:   [{name: critique, max_total_tokens: 512}]
      - alice: [{name: defense, max_total_tokens: 512}]
      - bob:   [{name: rebuttal, max_total_tokens: 512}]
      - judge: [{name: deliberation, visibility: private, max_total_tokens: 512},
                {name: verdict, kind: decision, max_total_tokens: 256}]
  prompt_config:
    file_path: infra/prompts/debate/hendrycks_math.yaml
    entry: math_proposer_critic
  fresh_positions: true
  agents:
    alice:
      trained: true
      model_settings:
        model_type: local
        model_file_path: Qwen/Qwen2.5-Math-1.5B-Instruct
        alias: proposer-alice
        sampling: {train: {temperature: 1.0, top_p: 1.0}}
    bob:
      trained: true
      model_settings:
        model_type: local
        model_file_path: Qwen/Qwen2.5-Math-1.5B-Instruct
        alias: critic-bob
        sampling: {train: {temperature: 1.0, top_p: 1.0}}
    judge:
      model_settings:
        model_type: local
        model_file_path: Qwen/Qwen3.5-4B
        alias: judge
        base_url: http://127.0.0.1:8788/v1
        sampling: {train: {temperature: 1.0, top_p: 1.0}}
  judge_config: {schema_name: competitive, retries: 4}
  scoring:
    scoring: continuous
    confidence_source: json
    shaping:
      - {kind: format_reward, coeff: 0.1, slots: [proposal], flag: strict_boxed}
  dataset: {type: math, levels: 5, relaxed_extraction: true, seed: 0, prompt_file: infra/prompts/tasks/math.yaml}
  training:
    backend: verl
    verl:
      prompt_length: 6144
      response_length: 512
      max_token_len_per_gpu: 8192
      checkpoint_dir: /workspace/checkpoints
      extra_overrides:
        - "++actor_rollout_ref.actor.optim.clip_grad=0.5"
        - "++actor_rollout_ref.actor.optim.weight_decay=0.0"
        - "++actor_rollout_ref.actor.loss_agg_mode=seq-mean-token-mean"
    wandb_entity: palaestra-research
    wandb_project: debate-math
    lora_rank: 16
    loss: {kind: cispo, clip_low: 0.8, clip_high: 1.28}
    ppo_epochs: 2
    micro_batch: 64
    warmup_steps: 100
    adv_length_norm: none
    adv_population_std: true
    drop_zero_advantage: false
    kl_mechanism: loss
    steps: 501
    batch_size: 8
    group_size: 8
    lr: 3.0e-5
    kl_coef: 0.05
    kl_discount_factor: 0.0
    eval_every: 100
    eval_n: 512
    eval_max_tokens: 512
    save_every: 100
