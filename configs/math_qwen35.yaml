# Qwen3.5-4B on MATH level-5: DAPO vs CISPO, 200 steps each.
# Pool fit (2026-08-14, scripts/hmmt_pass_eval.py): L5 pass@1 .558 / pass@8
# .867 at uncapped think; AIME-2026 and HMMT sit far below the 20-85 band.

# Objective shared with the debate arm (configs/_qwen35_training.yaml):
# loss, KL and optimizer live there so the pair cannot drift.
_includes: [_qwen35_training.yaml]

_qwen35_l5:
  model: Qwen/Qwen3.5-4B
  enable_thinking: true
  think_tokens: 4000
  max_completion_tokens: 1024
  dataset: {type: math, levels: 5, seed: 0, think_overshoot_penalty: 0.1, prompt_file: infra/prompts/tasks/math_nocot.yaml}
  # dev/test read the AMC pool (83 problems, base .422 greedy): L5 dev
  # saturates ~.97 by step 20 while AMC discriminates (2026-08-14 fit check).
  eval_dataset: {type: amc, prompt_file: infra/prompts/tasks/math_nocot.yaml, think_overshoot_penalty: 0.1}
  training:
    backend: verl
    verl:
      n_gpus: 1
      # Pinned WITH n_gpus, not left to the topology. These two are one
      # decision -- how the box's GPUs split between the FSDP training group
      # and the rollout engine's TP replicas -- and an arm that states only
      # n_gpus keeps the detected machine's rollout_tp for the half it did not
      # mention. On a 2xB200 pod that silently produced n_gpus 1 with TP 2, and
      # verl asserted "rollout world_size: 1 is not divisible by
      # infer_world_size: 2" nineteen minutes and two rented B200s into
      # qwen35_fmt_warmup_l3 (2026-08-26). run_common.check_gpu_split now
      # refuses that combination at launch; this states the value it wants.
      rollout_tp: 1
      gpu_memory_utilization: 0.45
      # budget-forced resubmission: prompt side sees base + think_tokens
      prompt_length: 6144
      response_length: 5120
      max_token_len_per_gpu: 12288
      checkpoint_dir: /workspace/checkpoints
      extra_overrides:
        # LOAD-BEARING (smoke-proven 2026-08-14): adapter-name sync crashes on
        # the VL wrapper's vision tower and silently drops LoRA on GDN
        # in_proj_a/b (vllm#38085). Do not remove without a passing smoke.
        - "++actor_rollout_ref.model.lora.merge=True"
    wandb_entity: palaestra-research
    wandb_project: debate-math
    lora_rank: 32
    lr: 1.0e-4
    warmup_steps: 10
    lr_schedule: cosine
    min_lr_ratio: 0.2
    steps: 200
    batch_size: 8
    group_size: 8
    eval_every: 10
    eval_n: 256
    eval_max_tokens: 5120
    eval_split: dev
    save_every: 10

mathl5_qwen35_cispo:
  # Protocol/model from _qwen35_l5; objective from the shared base (later
  # parent wins). loss and kl_coef are NOT restated here: they must move on
  # both arms at once or the debate comparison is meaningless.
  _extends: [_qwen35_l5, _qwen35_train_base]

mathl5_qwen35_dapo:
  _extends: _qwen35_l5
  training:
    loss: {kind: ppo, clip_low: 0.8, clip_high: 1.28}
    kl_coef: 0.0
    dynamic_sampling_retries: 5

mathl5_qwen35_cispo_filtered:
  _extends: mathl5_qwen35_cispo
  # train pool cut to rows the base solves >0 of 8 at the capped protocol
  # (sweep 2026-08-19): 864 of 1600. Drops the 46% that is 0-for-8 (degenerate
  # all-wrong groups from step 0) but KEEPS the 17% 8-for-8: always-solved
  # rows cost idle rollouts while healthy and become mixed groups with
  # corrective gradient if format drifts — the 2vsj3nmi collapse had no such
  # anchor. Pure solve-band variant: configs/filters/l5_solveband_qwen35.json.
  dataset: {train_filter_file: configs/filters/l5_nonzero_qwen35.json}

mathl5_qwen35_cispo_sub8:
  _extends: mathl5_qwen35_cispo
  # train pool keeps rows the base does NOT always solve (solved < 8 of 8 at
  # the capped protocol, sweep 2026-08-19): 1321 of 1600 — the 585-row band
  # plus the 736 never-solved (headroom: trained policies exceed base pass@8,
  # so 0-for-8 rows unlock mid-run). Drops only the 279 always-solved.
  dataset: {train_filter_file: configs/filters/l5_sub8_qwen35.json}

mathl5_qwen35_smoke:
  _extends: mathl5_qwen35_cispo
  training:
    steps: 2
    batch_size: 2
    group_size: 4
    eval_every: 0
    save_every: 0

# Format warmup: teaches the 4000-think + \boxed{} shape on an easy pool so the
# debate/RLVR comparison starts format-compliant and spends none of the L5
# headroom. Levels are exact and disjoint, so the L5 train pool is untouched.
# Reward is format ONLY (correct_reward 0): a group where every sample boxes has
# zero advantage and is dropped, so this self-terminates as compliance lands.
qwen35_fmt_warmup_l3:
  _extends: [_qwen35_l5, _qwen35_train_base]
  dataset:
    levels: 3
    correct_reward: 0.0
    format_reward: 1.0
    relaxed_correct_bonus: 0.0
  training:
    # 100, not 40. The self-termination premise above -- saturated groups drop
    # to zero advantage, so the arm stops itself once compliance lands -- reads
    # the TRAIN metric, and that premise did not hold: train reward saturated
    # near .95 by step ~10 with whole batches dropping, while held-out
    # dev/answer_format_valid was still .66 at step 30 (.53 at step 0). L3
    # compliance landed; compliance that TRANSFERS, which is the only kind the
    # debate arm can use, had not. The extra steps buy that gap, and the arm
    # still self-terminates -- just against a bar it has actually cleared
    # (2026-08-26).
    steps: 100
    save_every: 10
    eval_every: 10

# RLVR baseline for the warm-start comparison. Ethan, 2026-08-27.
#
# Pairs with mathl5_qwen35_pc_debate_cispo_verl_sub8_warm: same merged
# weights, same sub8 pool, same CISPO objective, and the debate PROTOCOL is the
# only intervention. Both arms read `model` from the identical pod-local
# directory produced by scripts/merge_lora_ckpt.py, so the two start from
# byte-identical parameters -- which is what makes this a control rather than
# an approximate one.
#
# See the debate arm's note for why the warmup's step-40 `final` and not a
# later checkpoint, and for why the adapter is merged rather than --load'ed.
mathl5_qwen35_cispo_sub8_warm:
  _extends: mathl5_qwen35_cispo_sub8
  model: /workspace/models/qwen35-fmt-warmup-l3-s40
  training:
    verl:
      # OVERRIDE, with the reason: 2 GPUs, not _qwen35_l5's 1. Rollout is
      # 70-85% of a step on this protocol (the format warmup measured
      # rollout_generate_s 230-300s inside a ~350s step on 1x H200), and that
      # is the part data parallelism actually shortens -- one TP1 rollout
      # replica per GPU, FSDP2 training across both, exactly the split
      # mathl5_qwen35_pc_debate_cispo_verl uses on 2x B200. Expect ~1.7x, not
      # 2x: optim and the KL reference pass do not scale as cleanly.
      #
      # The effective batch is UNCHANGED -- batch_size 8 x group_size 8 = 64
      # trajectories per step either way, split across ranks rather than
      # enlarged -- so this is a throughput decision, not a training one.
      #
      # rollout_tp is restated WITH n_gpus and not left to the topology.
      # run_common.check_gpu_split refuses the half-override for the reason its
      # docstring gives: an arm that pins only n_gpus keeps the detected
      # machine's TP for the half it never mentioned. That is what put n_gpus 1
      # against TP 2 nineteen minutes and two rented B200s into
      # qwen35_fmt_warmup_l3 on 2026-08-26.
      n_gpus: 2
      rollout_tp: 1

# RLVR control for the Kenton debate arm, from vanilla Qwen. Ethan, 2026-08-27.
#
# think_overshoot_penalty goes to 0.0, which is the faithful translation rather
# than a softening: Kenton et al. (2608.17776 3.4) limit the CRITIQUE and
# REBUTTAL turns and exempt Alice's solution turn. An RLVR rollout is a solution
# turn and nothing else, so under that design it carries no length term at all.
# The debate arm's proposal slot is zeroed for the same reason.
#
# It is also the term that broke this arm on 2026-08-27 at 0.1. Being flat, it
# reaches a CISPO advantage only through its variance inside the group, so its
# pressure peaked near a 50% trip rate and vanished as the policy complied:
# train/think_overshoot hit 0.000 at step 32 and the term went inert, leaving a
# short-output regime with nothing holding it there. Held-out correct_strict
# fell .699 -> .530 (base level) between steps 30 and 40 while mean response
# length fell 2954 -> 1856 tokens, and by step 49, 21.9% of rollouts were
# repetition loops emitting `</think>` 37 times on average -- which SATISFIED
# answer_format_valid, so the format term was paying for the degeneracy.
#
# Length is still bounded: think_tokens 4000 is a hard cap enforced by
# budget_forced_sample, not a priced budget. Expect truncation to stay high from
# a vanilla start (base Qwen3.5-4B is force-closed on 99.3% of rollouts); this
# arm buys an uncontaminated correctness signal at that cost, and truncation is
# observable as dev/truncated if it needs revisiting.
mathl5_qwen35_cispo_sub8_kenton:
  _extends: mathl5_qwen35_cispo_sub8
  # BOTH, and not just `dataset`: eval_dataset carries its own copy of the key,
  # so zeroing only the train side leaves dev/reward_mean scored under a reward
  # function the policy is no longer trained on. dev/correct_strict and
  # dev/answer_format_valid are unaffected either way; the reward series is not.
  dataset: {think_overshoot_penalty: 0.0}
  eval_dataset: {think_overshoot_penalty: 0.0}
  training:
    verl:
      # 2 GPUs, not _qwen35_l5's 1 — same reasoning as
      # mathl5_qwen35_cispo_sub8_warm above: rollout is 70-85% of a step and is
      # the part data parallelism shortens. rollout_tp is restated WITH n_gpus
      # because run_common.check_gpu_split refuses the half-override.
      n_gpus: 2
      rollout_tp: 1
