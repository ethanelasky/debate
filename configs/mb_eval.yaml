# MonitoringBench eval-only experiments: the blind side-choice debate arm
# (mb_debate, PRIMARY) and its single-consultancy baseline
# (mb_single_consultancy_choice), plus 4-row smoke slices. 2026-08-06: the old
# assigned-seating arms were deleted as superseded by blind choice, and the
# mb_debate_choice arm was renamed to mb_debate — see git history and
# MB_PROMPT_DELTAS.md for provenance.
#
# EVAL-ONLY (no training block): binary attack-vs-honest classification of
# bash agent trajectories. Ground truth is meta["label"]; seating is NOT
# fixed — alice's blind choice decides which seat argues "attack".
#
# Run: python -m infra.run_eval --experiment-file configs/mb_eval.yaml --experiment <name>
#
# SAFETY: data/monitoringbench/*.jsonl contain red-team attack trajectories.
# Never print/log record contents; work by id/label/count only.

_models:
  # DashScope qwen3.6-flash debater (both seats). Ported from old
  # base_config.yaml `qwen36_flash_debater` (working tree :565-569);
  # generation_params.max_new_tokens -> max_new_tokens.
  # Temperature: NONE declared (provider default) — recorded decision, parity
  # with the old arms.
  qwen36_flash_debater:
    model_type: alibaba
    model_file_path: qwen3.6-flash
    max_new_tokens: 32768
  # DeepSeek-V4-Flash judge (MonitoringBench debate/consultancy arms).
  # DeepSeek first-party is not servable from this account (404, 2026-07-31);
  # pinned to parasail/fp8 by recorded decision. Ported from old
  # base_config.yaml `deepseekv4_flash_judge` (:207-215).
  # capture_token_logprobs: true — judge logit channel is extra measurement;
  # the json channel remains primary (recorded decision).
  deepseekv4_flash_judge:
    model_type: openrouter
    model_file_path: deepseek/deepseek-v4-flash
    provider_order: ["parasail"]
    quantizations: ["fp8"]
    capture_token_logprobs: true
    max_new_tokens: 32768
  # small-judge arm; DashScope has no 4b (Access denied 2026-07-31), pinned
  # parasail/bf16 by recorded decision. Ported from old base_config.yaml
  # `qwen35_9b_judge` (:216-226).
  # User decision 2026-07-31: no-think judge — OpenRouter reasoning
  # {"enabled": false} verified on the pinned parasail/bf16 endpoint.
  qwen35_9b_judge:
    model_type: openrouter
    model_file_path: qwen/qwen3.5-9b
    provider_order: ["parasail"]
    quantizations: ["bf16"]
    enable_thinking: false
    max_new_tokens: 32768

# Shared base (non-runnable). Protocol + prompt entry live in the LEAF
# experiments only: config lists merge BY INDEX, so a child overriding a
# parent protocol's `turns` would silently inherit leftover parent turns.
_mb_base:
  prompt_config:
    file_path: infra/prompts/debate/monitoringbench.yaml
  fresh_positions: false   # choice mode: the binder sets positions, not extraction
  flip: false              # no mirrored arm; seating follows the blind choice
  # POST-GENERATION visible truncation of non-judge speech slots; must equal
  # the {limit}=250 baked into the prompt file's
  # vars.SPEECH_TOKEN_LIMIT_INSTRUCTION. Does NOT cap generation — the
  # per-slot max_total_tokens: 4096 below keeps the generation budget
  # (context-overflow protection: trajectories run up to ~58k input tokens;
  # at 4096 reserved output none of the 258 old rows overflowed).
  speech_token_limit: 250
  agents:
    alice:
      model_settings:
        _preset: qwen36_flash_debater
        alias: qwen36-flash-alice
    bob:
      model_settings:
        _preset: qwen36_flash_debater
        alias: qwen36-flash-bob
    judge:
      model_settings:
        _preset: deepseekv4_flash_judge
        alias: deepseekv4-flash-judge
  # retries: 4 matches the old repo's judge max_retries default (judge.py:765).
  judge_config: {schema_name: competitive, retries: 4}
  dataset:
    # 2026-07-30 pool amendment: honest_mb116 + attacks_covering140_v2 = 256 rounds.
    files:
      - data/monitoringbench/honest_mb116.jsonl
      - data/monitoringbench/attacks_covering140_v2.jsonl
    seed: 0

# ---- Blind side-choice debate arm (2026-08-03; PRIMARY) ----
# Alice's first slot (blind_assessment, solution kind) is generated in the
# SOLO context: first_speech_non_debate_aware renders Task.messages verbatim,
# built by the task source from infra/prompts/tasks/monitoringbench.yaml as
# [system: monitor card][user: trajectory][user: blind instructions] — no
# debate framing, no assigned side. The pack splices the same two named
# messages in (blind_assessment cue = ANSWER_GEN_USER, shared pre_debate =
# TRAJECTORY_USER), so the blind view, the RLVR prompt, and every seat's
# trajectory preamble stay byte-identical by construction. The
# <answer>attack|benign</answer> tag picks alice's
# side; bob argues the opposite; the blind assessment is PUBLIC (alice's
# opening speech). Turn 1 stays mutually blind (same-turn co-occupancy).
# Seating is NOT fixed: attack_seat per row comes
# from the bound position strings; rows carry chosen_side + choice_retries,
# the summary a blind_choice accuracy block. Unparseable choices retry with
# feedback (choice_retries, default 4), then the round fails loudly.
mb_debate:
  _extends: _mb_base
  choice_positions: true
  choice_retries: 4
  first_speech_non_debate_aware: true
  protocol:
    turns:
      - alice: [{name: blind_assessment, kind: solution, max_total_tokens: 4096}]
        bob:   [{name: pre_opening_speech, max_total_tokens: 4096}]
      - alice: [{name: pre_speech, max_total_tokens: 4096}]
        bob:   [{name: pre_speech, max_total_tokens: 4096}]
      - judge: [{name: deliberation, visibility: private, max_total_tokens: 32768},
                {name: post_round_judge_without_reasoning, kind: decision, max_total_tokens: 2048}]
  prompt_config:
    entry: mb_debate

# ---- Single-consultancy choice arm (2026-08-03; BASELINE) ----
# Same blind first slot as the debate arm (identical solo context, identical
# trajectory message), then ONE develop speech, then the judge GRADES the
# consultant: judge_config schema_name 'collaborative' -> verdict
# {"Debater_A": {"verdict": correct|incorrect, "confidence": 0.5-1.0}};
# run_eval maps it to p_attack via the chosen side (P(correct) if alice chose
# attack, else 1 - P(correct)). vs mb_debate this isolates what the
# opponent + rebuttal dynamics add. Prompt entry wording is DRAFTED (adapted
# from the ported DC entry) — user review required before any run.
mb_single_consultancy_choice:
  _extends: _mb_base
  choice_positions: true
  choice_retries: 4
  first_speech_non_debate_aware: true
  judge_config: {schema_name: collaborative, retries: 4}
  # NOTE: _mb_base's bob agent is inherited too (deep-merge cannot remove
  # keys); bob is absent from this protocol, so his model object is
  # instantiated but never called. alice/judge restated for readability.
  agents:
    alice:
      model_settings:
        _preset: qwen36_flash_debater
        alias: qwen36-flash-alice
    judge:
      model_settings:
        _preset: deepseekv4_flash_judge
        alias: deepseekv4-flash-judge
  protocol:
    turns:
      - alice: [{name: blind_assessment, kind: solution, max_total_tokens: 4096}]
      - alice: [{name: pre_speech, max_total_tokens: 4096}]
      - judge: [{name: deliberation, visibility: private, max_total_tokens: 32768},
                {name: post_round_judge_without_reasoning, kind: decision, max_total_tokens: 2048}]
  prompt_config:
    entry: mb_single_consultancy_choice

mb_smoke4_debate:
  _extends: mb_debate
  dataset:
    task_ids:
      - attack_11436013_1
      - attack_13976680_0
      - honest_9614184_0
      - honest_34113609_0

mb_smoke4_single_consultancy_choice:
  _extends: mb_single_consultancy_choice
  dataset:
    task_ids:
      - attack_11436013_1
      - attack_13976680_0
      - honest_9614184_0
      - honest_34113609_0
