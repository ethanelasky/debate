# RLVR baseline for the OLMo debate experiments: same model, backend, and GRPO
# machinery as math_pc_olmo, but reward = direct answer verification (MathEnv)
# — no judge, no debate. Isolates optimization from reward quality: if THIS
# doesn't move eval, the problem is lr/LoRA capacity, not the debate loop.
#
# Run (on the pod): scripts/pod_run.sh rlvr math_rlvr_olmo_l5 --steps 100 --lr 1e-4

math_rlvr_olmo_l5:
  model: allenai/Olmo-3-7B-Instruct-DPO
  max_completion_tokens: 2000
  dataset: {type: math, levels: 5, seed: 0}
  training:
    backend: verl
    verl:
      n_gpus: 1
      strategy: fsdp2              # needs the modeling_olmo3 rope patch (provision_pod.sh)
      gpu_memory_utilization: 0.45 # no judge server: rollout can take more than debate's 0.33
      prompt_length: 1024          # system + one MATH problem
      response_length: 2000
      max_token_len_per_gpu: 16384
      checkpoint_dir: /workspace/checkpoints
    # The TEAM, not the api key's personal default entity — without this,
    # runs land in whoever launched them's own namespace and the rest of
    # the team cannot see them.
    wandb_entity: palaestra-research
    wandb_project: debate-math
    lora_rank: 32
    loss: {kind: ppo, clip_low: 0.8, clip_high: 1.2}
    ppo_epochs: 1
    adv_length_norm: count
    steps: 100
    batch_size: 8
    group_size: 8      # 8-way groups: tighter GRPO baselines than the debate runs' 4
    lr: 1.0e-4         # the debate lr that moved the policy (k1 grew) without eval gains
    kl_coef: 0.02
    kl_discount_factor: 0.0
    eval_every: 5
    eval_n: 256        # +-3.1pp binomial noise
    eval_max_tokens: 2000
    save_every: 25     # lora-only adapters (~100-200MB) on the network volume

# CoT-discovery arm: the neutral prompt (math_nocot.yaml — no step-by-step
# ask, no answer-only ban; deletion-only variant, test-pinned). Question: does
# verifier-reward RL discover derivations when the prompt is silent on them?
# Paired with math_pc_olmo_l5_g8_nocot; watch eval/has_boxed + response length
# alongside eval/correct_relaxed at step 0 for the starting behavior.
math_rlvr_olmo_l5_nocot:
  _extends: math_rlvr_olmo_l5
  dataset: {type: math, levels: 5, seed: 0, prompt_file: infra/prompts/tasks/math_nocot.yaml}

# Plan-then-answer arms: the RLVR twins of the math_pc_olmo debate entries,
# which give the proposer a private 1000-token plan slot before the proposal
# (the CoT surrogate with thinking off). Without this, the debate arm gets
# extra sequential compute the RLVR arm doesn't — a confound on top of the
# reward-source difference. The plan turn renders the task family's `plan` cue
# (math*.yaml), byte-identical to the debate plan slot's spliced <PLAN_USER>.
# prompt_length grows: the answer turn's prompt now carries the plan cue plus
# up to 1000 plan tokens.
math_rlvr_olmo_l5_plan:
  _extends: math_rlvr_olmo_l5
  plan_tokens: 1000
  training:
    verl:
      prompt_length: 4096

math_rlvr_olmo_l5_plan_nocot:
  _extends: math_rlvr_olmo_l5_plan
  dataset: {type: math, levels: 5, seed: 0, prompt_file: infra/prompts/tasks/math_nocot.yaml}

# AIME RLVR on the 32B (Ethan, 2026-08-07): plan-then-answer (1000-token
# private scratchpad, then a 1000-token answer — the MB scratchpad arm's
# shape and budgets, via PlannedEnv). Step-0 direct QA: 30.1% at a 3000-token
# cap under the old step-by-step prompt. AIME test split is 93 rows; eval_n
# covers all of it (+-4.7pp binomial noise, so trend calls need bigger moves
# than the L5 arms did).
# Hardware: 2xH200 (or 2xB200), fsdp2 + rollout_tp 2 — a 64GB bf16 policy
# can't colocate FSDP + a rollout replica on one 80-141GB card.
# Run: HF_HOME=/root/hf bash scripts/pod_run.sh rlvr aime_rlvr_olmo32
# (container-disk HF cache: the 65GB download does not fit the shared
# volume's free space, and the volume must stay clear for checkpoints).
aime_rlvr_olmo32:
  # allenai/Olmo-3.1-32B-Instruct-DPO @ fc84a4f, pre-converted to bf16 on the
  # volume. The HF repo ships fp32 (121GB/29 shards); loading THAT under TP2
  # silently OOM-killed the rollout workers twice (the worker-death monitor
  # surfaces it only as "RuntimeError: cancelled" — vLLM v0.24 has no init
  # timeout at all, so a dead worker is the only way to that error). bf16
  # (61GB) boots clean. Converter: one-shot shard-streaming cast, 2026-08-08.
  model: /workspace/models/olmo32-bf16
  # 1000, matching the MB scratchpad arm's budgets (Ethan 2026-08-07): plan
  # 1000 + answer 1000. The answer prompt asks for concise-but-rigorous
  # justification, not the old step-by-step derivation; watch eval/has_boxed
  # at step 0 for truncation regardless (direct QA truncated 48% at 3000
  # under the old prompt).
  max_completion_tokens: 1000
  plan_tokens: 1000
  dataset: {type: aime, seed: 0}
  training:
    backend: verl
    verl:
      n_gpus: 2
      strategy: fsdp2
      rollout_tp: 2                # one TP2 rollout replica; 32B weights split across both cards
      # 0.42, not 0.50: at rollout boot ~100GB/GPU is already resident (FSDP
      # actor+ref shards + torch reserved cache — evacuated H200 log
      # 2026-08-08: 40.22/139.8 free at that moment), and vLLM refuses to
      # start unless free >= util*total. 0.42*183GB(B200) = 77GB fits the
      # ~83GB actually free; on 141GB cards this config does NOT fit.
      gpu_memory_utilization: 0.42
      prompt_length: 4096          # problem + plan cue + up to 1000 plan tokens
      response_length: 1024        # covers the 1000-token plan and answer caps
      max_token_len_per_gpu: 16384
      checkpoint_dir: /workspace/checkpoints
      # Instrumented diagnosis 2026-08-08 (evacuation/manual-1786167529):
      # under verl's --enable_sleep_mode (CuMemAllocator + expandable
      # segments), vLLM's custom all-reduce hard-exits the TP workers from
      # C++ at custom_all_reduce.cuh:455 ('invalid argument') during graph
      # capture — no traceback, looks exactly like a silent SIGKILL. NCCL
      # allreduce over NVLink instead; negligible rollout cost. This may
      # also explain the first "fp32" crash (same cascade) — bf16 remains
      # right for load time and CPU headroom regardless.
      extra_overrides:
        - "++actor_rollout_ref.rollout.engine_kwargs.vllm.disable_custom_all_reduce=true"
    wandb_entity: palaestra-research   # the TEAM (see the base entry's note)
    wandb_project: debate-math
    lora_rank: 32
    loss: {kind: ppo, clip_low: 0.8, clip_high: 1.2}
    ppo_epochs: 1
    adv_length_norm: count
    steps: 100
    batch_size: 8
    group_size: 8
    lr: 1.0e-4
    kl_coef: 0.02
    kl_discount_factor: 0.0
    eval_every: 5
    eval_n: 93         # the whole AIME held-out split
    eval_max_tokens: 1000
    save_every: 25

# Peak-decay probes (Ethan, 2026-08-08): the L5 RLVR runs and (tentatively)
# the AIME baseline show quick gains that partially give back at lr 1e-4 /
# kl 0.02. Two single-factor arms against aime_rlvr_olmo32 isolate the
# mechanism: is the KL leash reeling the policy back once all-correct groups
# stop contributing gradient, or is the lr overshooting?
aime_rlvr_olmo32_lowkl:
  _extends: aime_rlvr_olmo32
  training:
    kl_coef: 0.001

aime_rlvr_olmo32_lowlr:
  _extends: aime_rlvr_olmo32
  training:
    lr: 3.0e-5

# Rollout-reuse arms (Ethan, 2026-08-08): B200 gradient steps are cheap
# relative to rollouts, so reusing each rollout batch for 2 PPO epochs is the
# cost lever — and multi-epoch is off-policy, which is where GSPO's
# sequence-level ratio earns its keep. Paired: same budget, epochs 2, PPO vs
# GSPO (paper-scale clips; verl reads them as 1±eps — see backend guard).
aime_rlvr_olmo32_2epoch:
  _extends: aime_rlvr_olmo32
  training:
    ppo_epochs: 2

aime_rlvr_olmo32_gspo:
  _extends: aime_rlvr_olmo32
  training:
    ppo_epochs: 2
    loss: {kind: gspo, clip_low: 0.9997, clip_high: 1.0004}

# tiny live-verification arm for the 32B AIME arm
aime_rlvr_olmo32_smoke:
  _extends: aime_rlvr_olmo32
  training:
    steps: 2
    batch_size: 2
    group_size: 4
    eval_every: 0
    save_every: 0

# tiny live-verification arm
math_rlvr_olmo_smoke:
  _extends: math_rlvr_olmo_l5
  training:
    steps: 2
    batch_size: 2
    group_size: 4
    eval_every: 0
    save_every: 0

# ---- "Make LoRA work on AIME" recipe arms (Ethan, 2026-08-08) ----
# The field's AIME-RLVR successes ride response-length growth; ours capped it
# at 1000 for MB parity. These arms give the LENGTH lever to the PRIVATE
# scratchpad (answer stays 1000, parseable and MB-shaped) and reuse rollouts.

# DAPO translation (paper 2503.14476; Codex consult 2026-08-08): clip-higher
# 0.8/1.28, no KL, dynamic sampling (retry cap 5 is an engineering choice —
# the paper oversamples unboundedly). Overlong reward shaping omitted (needs
# a length-shaping reward channel we don't have; noted, not silently skipped).
aime_rlvr_olmo32_dapo:
  _extends: aime_rlvr_olmo32
  training:
    loss: {kind: ppo, clip_low: 0.8, clip_high: 1.28}
    kl_coef: 0.0
    dynamic_sampling_retries: 5

# 8k private scratchpad + 2 GRPO epochs, PPO loss.
aime_rlvr_olmo32_plan8k:
  _extends: aime_rlvr_olmo32
  plan_tokens: 8192
  training:
    ppo_epochs: 2
    verl:
      prompt_length: 12288       # problem + plan cue + up to 8192 plan tokens
      response_length: 8192      # the plan turn generates up to plan_tokens
      max_token_len_per_gpu: 24576

# Same, CISPO loss (IS-weight clamp with stop-grad keeps gradient from every
# token — MiniMax-M1's fix for clipped-token gradient starvation, plausibly
# what LoRA's thin pipe needs). Asymmetric DAPO-style bounds.
# THE LONG BET (Ethan 2026-08-08): 200 steps, eval every 20 (plan8k evals
# generate ~9k tokens/problem — at every-5 they would eat ~25% of wall-clock,
# at every-20 ~3%). If still climbing at 200, continue to 400 via
# --load .../step-00200 --wandb-resume <run-id> on the same curve.
aime_rlvr_olmo32_plan8k_cispo:
  _extends: aime_rlvr_olmo32_plan8k
  training:
    loss: {kind: cispo, clip_low: 0.8, clip_high: 1.28}
    steps: 200
    eval_every: 20
    # save_every must be a MULTIPLE of eval_every (Ethan, 2026-08-09): every
    # checkpoint then lands on a step with a known eval, so a continuation
    # never resumes from a blind point (the step-25 ckpt / step-20 peak
    # mismatch of the first flagship run).
    save_every: 20
    dynamic_sampling_retries: 5

# Oversample-upfront twin (Ethan, 2026-08-09): one 3x-sized generation round
# replaces the serial retry chain — same degenerate-group policing, one
# generation latency per step instead of 1 + retries. ~3x rollout tokens/step;
# on B200 the step is latency-bound, not throughput-bound, so this is the
# faster trade. For the continuation / next launch, NOT a mid-flight change.
aime_rlvr_olmo32_plan8k_cispo_os3:
  _extends: aime_rlvr_olmo32_plan8k_cispo
  training:
    dynamic_sampling_retries: 0
    oversample_factor: 3

# Think-DPO ablation arm (Ethan, 2026-08-08): the THINKING model on AIME,
# using its native private <think> channel instead of the PlannedEnv
# scratchpad turn — single-turn generation, thinking ON, think phase
# HARD-CAPPED at 8192 tokens (budget-forced sampling injects </think> at the
# cap, masked from training, and the visible answer continues under
# max_completion_tokens). Answer format rewards unchanged (MathEnv.reward).
# Standalone entry, not _extends aime_rlvr_olmo32: _extends cannot REMOVE the
# base's plan_tokens, and plan_tokens + think_tokens is rejected at launch.
aime_rlvr_olmo32think:
  # bf16 on HF (64.5GB, same Olmo3ForCausalLM arch) — no fp32->bf16
  # conversion step this time. Download: HF_HOME=/workspace/hf so the ~64GB
  # cache lands on the network volume (~100G free) and survives pod stops
  # (the container disk is wiped on stop).
  model: allenai/Olmo-3-32B-Think-DPO
  enable_thinking: true
  # Think content is PRIVATE compute for the reward, on two layers
  # (answer_parsing.py): strip_think_blocks deletes complete
  # <think>...</think> blocks before any boxed extraction, and when the chat
  # template pre-opens <think> (completion carries only the close, so the
  # block survives stripping) extraction still takes the LAST boxed — a boxed
  # guess inside the think phase can never beat a boxed final answer, and is
  # graded only if the visible answer never boxes at all. One caveat, stated
  # exactly: the 0.1 format bonus keys on a raw '\boxed{' substring
  # (MathEnv.reward has_boxed), so a think-phase box does earn that shaping
  # term even when the answer has none.
  think_tokens: 8192
  max_completion_tokens: 1000
  # think_overshoot_penalty: 0.1 off the reward whenever the think phase was
  # force-closed at the 8192 cap instead of closing itself; the
  # think_overshoot info key (0/1 per sample) tracks the rate.
  dataset: {type: aime, seed: 0, think_overshoot_penalty: 0.1}
  training:
    backend: verl
    verl:
      n_gpus: 2
      strategy: fsdp2
      rollout_tp: 2                # 32B weights split across both cards (see aime_rlvr_olmo32)
      gpu_memory_utilization: 0.42 # same rollout-boot headroom math as aime_rlvr_olmo32
      # NOT 2048: budget-forced sampling closes an overlong think phase by
      # resubmitting prompt + <think> content + forced </think> as a SECOND
      # request, so the engine sees prompts up to base + think_tokens (~8.4k
      # observed; killed attempt 4b at 2048 via the truncation guard).
      prompt_length: 12288
      response_length: 10240       # 8192 think + 1000 answer + margin, ONE request
      max_token_len_per_gpu: 16384
      checkpoint_dir: /workspace/checkpoints
      # NCCL allreduce instead of vLLM's custom kernel — same sleep-mode
      # crash as aime_rlvr_olmo32 (see that entry's note).
      extra_overrides:
        - "++actor_rollout_ref.rollout.engine_kwargs.vllm.disable_custom_all_reduce=true"
    wandb_entity: palaestra-research   # the TEAM (see the base entry's note)
    wandb_project: debate-math
    lora_rank: 32
    loss: {kind: ppo, clip_low: 0.8, clip_high: 1.2}
    ppo_epochs: 1
    adv_length_norm: count
    steps: 100
    batch_size: 8
    group_size: 8
    lr: 1.0e-4
    kl_coef: 0.02
    kl_discount_factor: 0.0
    eval_every: 5
    eval_n: 93         # the whole AIME held-out split
    # no eval_max_tokens: eval rollouts run under the SAME think/total
    # SlotLimits as training (9192 total); a 1000-token eval ceiling would
    # silently shrink the think cap, and run_rlvr rejects any value below
    # think_tokens + max_completion_tokens.
    save_every: 25

# CISPO recipe on a smaller, stronger-floored policy (Ethan, 2026-08-08):
# Qwen3.5-9B (AIME floor 43% think-off — the best sub-32B instruct we
# measured) under the fixed 8k scratchpad + commit-directly prompt. Decouples
# "does the recipe work" from "is OLMo-32B/LoRA the problem": a 9B trains
# ~4x faster and the LoRA pipe covers a larger fraction of the model.
# Hybrid-thinking model: enable_thinking false is a real setting, verified
# against the template at launch.
aime_rlvr_qwen9b_plan8k_cispo:
  model: Qwen/Qwen3.5-9B
  enable_thinking: false
  max_completion_tokens: 1000
  plan_tokens: 8192
  dataset: {type: aime, seed: 0}
  training:
    backend: verl
    verl:
      n_gpus: 2
      strategy: fsdp2
      rollout_tp: 1                # 17GB bf16: one replica PER GPU — 2x rollout throughput
      gpu_memory_utilization: 0.42
      prompt_length: 12288
      response_length: 8192
      max_token_len_per_gpu: 24576
      checkpoint_dir: /workspace/checkpoints
      extra_overrides:
        - "++actor_rollout_ref.rollout.engine_kwargs.vllm.disable_custom_all_reduce=true"
    wandb_entity: palaestra-research
    wandb_project: debate-math
    lora_rank: 32
    loss: {kind: cispo, clip_low: 0.8, clip_high: 1.28}
    ppo_epochs: 2
    adv_length_norm: count
    steps: 200
    batch_size: 8
    group_size: 8
    lr: 1.0e-4
    kl_coef: 0.02
    kl_discount_factor: 0.0
    eval_every: 20
    eval_n: 93
    eval_max_tokens: 1000
    save_every: 25
    dynamic_sampling_retries: 5

# Think-track flagship (Ethan, 2026-08-09: "no debate until RLVR works"):
# CISPO on the pre-RL think checkpoint, native 8k <think> (hard-capped,
# overshoot penalized), judged against the SAME LINE's RL-final —
# Olmo-3-32B-Think measured as the attainable-RL yardstick. 60 steps from
# the start (real 8-9k generations run ~30min/step on 2xB200; the 200-step
# version of this costs ~$1.4k — continue via --load/--wandb-resume if the
# curve is alive at 60).
aime_rlvr_olmo32think_cispo:
  _extends: aime_rlvr_olmo32think
  training:
    loss: {kind: cispo, clip_low: 0.8, clip_high: 1.28}
    ppo_epochs: 2
    steps: 60
    eval_every: 20
    save_every: 20     # multiple of eval_every — see the plan8k_cispo note
    dynamic_sampling_retries: 5

# Oversample-upfront twin of the think arm (see the plan8k _os3 note).
aime_rlvr_olmo32think_cispo_os3:
  _extends: aime_rlvr_olmo32think_cispo
  training:
    dynamic_sampling_retries: 0
    oversample_factor: 3
