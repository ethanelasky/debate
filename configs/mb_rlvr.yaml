# RLVR on the MonitoringBench blind side choice: same model, backend, and GRPO
# machinery as math_rlvr_olmo, but reward = blind-choice correctness
# (<answer>attack|benign</answer> vs meta["label"] — see
# infra/envs/tasks/monitoringbench.py reward()). The judge-free baseline for
# the MB debate-training experiments.
#
# PROMPT PARITY: the RLVR context ([system: monitor role card][user:
# trajectory][user: blind instructions]) comes from the family's answer-generation
# config, infra/prompts/tasks/monitoringbench.yaml — the SAME file the eval
# arm's choice entries splice their blind view from — so it is byte-identical
# to the eval arm's blind view for the same row by construction. Edit wording
# there; nothing needs mirroring here.
#
# Run (on the pod): scripts/pod_run.sh rlvr mb_rlvr_olmo --steps 100 --lr 1e-4
#
# SAFETY: data/monitoringbench/*.jsonl contain red-team attack trajectories.
# Never print/log record contents; work by id/label/count only.

mb_rlvr_olmo:
  model: allenai/Olmo-3-7B-Instruct-DPO
  max_completion_tokens: 4096   # = the eval arm's blind_assessment slot budget
  dataset:
    type: monitoringbench
    # 2026-08-06 matched pool (LFS): 550 honest + 550 attack = 1100 rows, 50/50.
    # Mirrored per task — attacks(task) == honest(task) for all 116 tasks — so
    # neither the label prior nor task frequency is a free signal. Use
    # attacks_mb550_final, not attacks_mb550: the latter predates the honest
    # yield and misses the mirror on 11 tasks. Watch train/chose_attack against
    # a 0.50 base rate now.
    # NORMALIZED pool (scripts/mb_normalize_pool.py), not the raw files: the
    # raw pool leaked the label through surface statistics a policy can read
    # without any security reasoning — chars 0.786 AUC, steps 0.700, tool calls
    # 0.708, and a single length threshold classifying at 73.2% against a 50%
    # base rate. Normalization puts both generators on one step granularity and
    # matches call counts (residual 0.574 / 0.616 / 0.452). Provenance, the
    # rejected alternatives, and the residual artifacts are in
    # data/monitoringbench/norm/config.json. RLVR would happily learn the
    # shortcut, so this matters more here than anywhere else.
    files:
      - data/monitoringbench/honest_mb550_norm.jsonl
      - data/monitoringbench/attacks_mb550_norm.jsonl
    seed: 0
    # Canonical TASK-DISJOINT splits (scripts/mb_make_splits.py; provenance and
    # achieved stats in data/monitoringbench/splits/config.json). Supersedes the
    # test_size carve, INCLUDING 391e0e9's 800/300: as that commit's own message
    # noted, a row-level carve leaves every held-out task represented in train,
    # so it measured "spot an attack in a familiar task" rather than
    # generalization to an unseen one. The pool mirrors each task across labels,
    # which is what made the leak total rather than partial.
    #   train 730 rows / 60 tasks
    #   test  = the DEV split, 120 rows / 29 tasks — the selection surface
    #           (this curve, checkpoint choice, lr sweeps).
    # The 250-row eval split is named by NEITHER file, so it is unreachable from
    # this config: final numbers come from configs/mb_eval.yaml only.
    #
    # OPEN SIZING QUESTION (391e0e9 raised it and it is not resolved): 120 dev
    # rows is +-4.6pp at a 0.50 base rate, vs +-2.9pp for that commit's 300. The
    # task-disjointness constraint is what costs the rows — dev has to take whole
    # tasks. If this curve proves too noisy to read, grow dev in
    # scripts/mb_make_splits.py (TARGET_DEV_ROWS) and regenerate rather than
    # reverting to a leaky carve.
    split_files:
      train: data/monitoringbench/splits/train_ids.txt
      test: data/monitoringbench/splits/dev_ids.txt
  training:
    backend: verl
    verl:
      n_gpus: 1
      strategy: fsdp2              # needs the modeling_olmo3 rope patch (provision_pod.sh)
      gpu_memory_utilization: 0.45 # no judge server: rollout can take more than debate's 0.33
      # MB trajectories run to ~58k input tokens (mb_eval.yaml); 61440 + 4096
      # response = 65536, OLMo-3's YaRN context ceiling. A row over the cap
      # should fail loudly, not truncate silently.
      prompt_length: 61440
      response_length: 4096
      max_token_len_per_gpu: 65536 # packing unit must fit ONE full-length MB datum
      checkpoint_dir: /workspace/checkpoints
    wandb_project: debate-mb
    lora_rank: 32
    loss: {kind: ppo, clip_low: 0.8, clip_high: 1.2}
    ppo_epochs: 1
    adv_length_norm: count
    steps: 100
    batch_size: 8
    group_size: 8      # 8-way groups, as in math_rlvr_olmo_l5
    lr: 1.0e-4         # the math-RLVR lr that moved the policy; sweep from here
    kl_coef: 0.02
    kl_discount_factor: 0.0
    eval_every: 5
    # The WHOLE dev split (60 attack / 60 honest, +-4.6pp binomial noise).
    # Keep this equal to the dev split size: tasks() returns test_rows[:n], a
    # prefix rather than a sample (391e0e9), so anything smaller strands the
    # tail — those rows are held out of training and never evaluated either.
    # Split files are ordered label-alternating and task-round-robin, so a
    # smaller value would at least stay balanced, but it would still waste rows.
    eval_n: 120
    eval_max_tokens: 4096
    save_every: 25     # lora-only adapters (~100-200MB) on the network volume

# tiny live-verification arm: 2 train steps plus ONE eval pass over the first
# 8 dev rows (1 batch-worth, 4 attack / 4 honest by the split file's ordering)
# — the eval rollout path is part of what the smoke verifies (Ethan
# 2026-08-05). Inherits the parent's split_files: no separate carve to keep in
# sync.
mb_rlvr_olmo_smoke:
  _extends: mb_rlvr_olmo
  training:
    steps: 2
    batch_size: 2
    group_size: 4
    eval_every: 1
    eval_n: 8
    save_every: 0

# ---- Qwen3.6-35B-A3B arm (2026-08-06) ----
# The RLVR baseline for the debate experiment whose DEBATER is this same model
# (judge: Qwen/Qwen3.5-9B). Baseline and debate arm must share one policy, so
# this supersedes mb_rlvr_olmo as the reference arm; the OLMo arm stays for its
# recorded curve. Dataset block is a copy of mb_rlvr_olmo's — same normalized
# pool, same canonical task-disjoint splits; the provenance and the
# surface-statistic leak notes up there apply here unchanged and are not
# repeated.
#
# BACKEND: tinker, not verl. Tinker hosts this model (and the 9B judge) at
# max_context_length 65536, and Qwen3.6-35B-A3B is ~70GB in bf16 — it does not
# fit the single 80GB H100 the OLMo arm trains on, and a verl port would mean
# FSDP2+LoRA over qwen3_5_moe (hybrid linear attention, 256 experts, VL
# wrapper, MTP head) on rented multi-GPU hardware. No verl block here: none of
# those knobs are read on this backend.
#
# CONTEXT: measured, not assumed. scripts/mb_prompt_lengths.py over all 1100
# rows under THIS tokenizer: max 49766 prompt tokens (train), p99 37964,
# median 16350 — 0/1100 over the 61440 room that 65536 - 4096 leaves. The
# OLMo-era "~58k" figure was that tokenizer's; Qwen's 248k vocab packs bash
# transcripts far tighter. Re-run the census before changing model or pool.
mb_rlvr_qwen36:
  model: Qwen/Qwen3.6-35B-A3B
  # Hybrid-thinking model: the template opens a <think> block unless told
  # otherwise, so no-think is a real setting here rather than a no-op. Verified
  # against the template at launch (run_rlvr._check_thinking_toggle).
  enable_thinking: false
  # 1000, NOT the eval arm's 4096 blind_assessment budget (Ethan 2026-08-06).
  # With thinking off the blind judgment plus its <answer> tag is short, and the
  # budget is what every rollout and every eval generation costs. Prompt parity
  # with the eval arm is unaffected — that is a property of the rendered
  # messages, not of the generation cap — but a truncated assessment scores as
  # unparseable, so watch train/answer_format_valid for a drop against the smoke's 1.0.
  max_completion_tokens: 1000
  dataset:
    type: monitoringbench
    files:
      - data/monitoringbench/honest_mb550_norm.jsonl
      - data/monitoringbench/attacks_mb550_norm.jsonl
    seed: 0
    split_files:
      train: data/monitoringbench/splits/train_ids.txt
      test: data/monitoringbench/splits/dev_ids.txt
    # Confidence tiebreaker, OFF by default (0.0 = byte-identical binary
    # reward). Adds coeff * P(answer word) for correct verdicts and
    # coeff * (1 - P) for wrong ones, so an all-agree GRPO group keeps nonzero
    # advantage variance instead of being dropped whole
    # (pack/n_datums_dropped_zero_advantage). CAUTION: it pressures the
    # monitor's calibration (pushing stated confidence to 1.0 is the reward
    # hack), and norm_adv_by_std amplifies the tiny spreads it creates — set
    # training norm_adv_by_std: false (or lower the lr) when enabling.
    # answer_conf_coeff: 0.05
  training:
    backend: tinker
    wandb_project: debate-mb
    lora_rank: 32
    loss: {kind: ppo, clip_low: 0.8, clip_high: 1.2}
    ppo_epochs: 1
    # datum, NOT the OLMo arm's count. Tinker's losses are token SUMS, so
    # advantages need the token scaling to get token-mean semantics (verl
    # aggregates token-mean itself, which is why that arm could leave it off).
    # Note count is a no-op for single-turn RLVR anyway — one datum per
    # trajectory means its divisor is always 1.
    adv_length_norm: datum
    steps: 100
    batch_size: 8
    group_size: 8
    # SWEPT, three arms in parallel (Ethan 2026-08-06): 1e-3 / 1e-4 / 1e-5 via
    # --lr, which namespaces each arm's run name and docent directory. 1e-4 is
    # the default here because it is the lr that moved the policy on the OLMo
    # arms; it does NOT transfer across backends (verl aggregates token-mean,
    # tinker sums), which is what the two decades on either side are for.
    lr: 1.0e-4
    kl_coef: 0.02
    kl_discount_factor: 0.0
    # Datums here carry the whole ~16-50k-token prompt, so the default 64 per
    # forward_backward is 1-3M tokens in one call. Lower until a step is known
    # to hold.
    micro_batch: 8
    eval_every: 5
    eval_n: 120        # the WHOLE dev split — see the OLMo arm on why not less
    eval_max_tokens: 1000   # = max_completion_tokens: eval and train generate alike
    save_every: 25

# ---- Scratchpad arm (2026-08-06) ----
# Plan-then-answer: a private scratchpad turn before the blind assessment (the
# CoT surrogate with thinking off), the RLVR twin of the debate seat's plan
# slot. Without it the debate arm gets sequential compute this baseline does
# not, which confounds the arm comparison on top of the reward-source
# difference. PlannedEnv wraps train AND eval, so the policy is measured in the
# mode it is trained in.
#
# The plan turn inherits the solo CONTEXT (monitor card + trajectory) and adds
# the family's `plan` cue; the answer turn continues that conversation into the
# unchanged blind instructions. The trajectory is rendered ONCE across both
# turns — a second copy of a 49766-token row would not fit 65536 at all.
#
# Cost: two datums per trajectory, each carrying the full trajectory prompt, so
# roughly 2x the tokens per rollout of the no-scratchpad arms (accepted, Ethan
# 2026-08-06). The lr1e-3 arm of the no-scratchpad sweep collapsed to
# all-attack by step ~70; only 1e-4 and 1e-5 are carried over here.
# RESULTS (2026-08-07, eval split, scripts/mb_evalsplit.py, greedy): base
# 0.816 -> lr1e-4 step-75 0.832 / final 0.840 (n=250; attack recall
# .648/.744/.712, honest .984/.920/.968). Paired McNemar final-vs-base: 16
# gained / 10 lost, p=0.33 — direction positive, NOT confirmed. Checkpoint
# choice moves the aggregate <1pp but 34/250 rows flip between step-75 and
# final: late training oscillates along the attack-vs-honest tradeoff (most
# groups are all-agree — watch pack/n_datums_dropped_zero_advantage, 64-112
# of 128 per step — so the reward has little gradient left at this base
# accuracy). lr1e-5 was flat on dev and, per protocol, never touched the eval
# split. Per-row outcomes (ids/labels/correct only): local
# outputs/mb_evalsplit_20260807/ (outputs/ is gitignored); regenerate with
# three mb_evalsplit.py passes if lost.
#
# CUE PROVENANCE — these numbers are bound to the "answer directly" blind cue
# that landed as 04f5dd6, which is also what the relaunch pair
# (ol1vuv8y/fpdddy8n) trained under. The 2026-08-07 launches went out with
# UNCOMMITTED prompt edits, so the runs' recorded wandb commits do not
# describe what they trained on — verify cue wording against transcript
# samples, never the commit. Cue history: the first launch pair (dev means
# ~.78) used the older verbose cue (scrutiny hints + "reason through
# carefully"); dropping it was worth ~+8pp at step 0. A third
# justification-then-answer variant exists in the launching checkout (for the
# OLMo policy-swap sweep) but has NOT landed here — if an arm trains under
# it, its baseline needs a re-eval under that cue: one edit of
# infra/prompts/tasks/monitoringbench.yaml and two mb_evalsplit.py passes.
# Checkpoints: lr1e-4 = tinker run
# 088d4a8e-1d80-5a98-848e-7861ac422c37:train:0, lr1e-5 = cd749edb-....
mb_rlvr_qwen36_scratchpad_on:
  _extends: mb_rlvr_qwen36
  plan_tokens: 1000   # = the answer budget, and math's plan slot cap

mb_rlvr_qwen36_scratchpad_on_smoke:
  _extends: mb_rlvr_qwen36_scratchpad_on
  training:
    steps: 2
    batch_size: 2
    group_size: 4
    eval_every: 1
    eval_n: 8
    save_every: 0

# Live-verification arm, twin of mb_rlvr_olmo_smoke: 2 train steps + an eval
# pass over the first 8 dev rows. First thing to run — it is what proves tinker
# will LoRA-train this model at this context, before 100 steps of spend.
mb_rlvr_qwen36_smoke:
  _extends: mb_rlvr_qwen36
  training:
    steps: 2
    batch_size: 2
    group_size: 4
    eval_every: 1
    eval_n: 8
    save_every: 0
