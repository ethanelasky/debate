# Hardware topology -> training.verl plumbing defaults (Ethan, 2026-08-10).
# Key = "<count>x<GPU>" as auto-detected from nvidia-smi at launch
# (infra/run_common.resolve_topology). Arm-level verl keys WIN over these;
# extra_overrides concatenates (topology first) instead — see apply_topology.
#
# Contract: every entry here has survived at least one smoke run on that
# silicon. A detected topology with no entry is a launch error on purpose —
# add the entry AND smoke it before the first paid run. Science knobs
# (prompt_length, response_length) stay in the arms.

# UNVALIDATED for the 32B CodeContests arm until its dedicated one-step smoke
# completes. Preload the immutable base checkpoint so the first LoRA sync does
# not CPU-stage another full copy of the 32B model.
1xB200:
  n_gpus: 1
  rollout_tp: 1
  gpu_memory_utilization: 0.42
  extra_overrides:
    - "actor_rollout_ref.rollout.load_format=safetensors"
    - "actor_rollout_ref.rollout.layered_summon=true"

# Validated: judge-probe smoke (2026-08-13).
1xH200:
  n_gpus: 1
  rollout_tp: 1
  gpu_memory_utilization: 0.42

# Validated: cs285 gspo/dapo arms (2026-08-13).
1xH100:
  n_gpus: 1
  rollout_tp: 1
  gpu_memory_utilization: 0.42

# UNVALIDATED: smoke on first launch (plan1k-dapo bring-up, 2026-08-14).
2xH100:
  n_gpus: 2
  rollout_tp: 2
  gpu_memory_utilization: 0.42
  extra_overrides:
    - "++actor_rollout_ref.rollout.engine_kwargs.vllm.disable_custom_all_reduce=true"

# Validated: the whole AIME 32B campaign (2026-08-08..10).
2xB200:
  n_gpus: 2
  rollout_tp: 2
  gpu_memory_utilization: 0.42
  extra_overrides:
    - "++actor_rollout_ref.rollout.engine_kwargs.vllm.disable_custom_all_reduce=true"
    # Preload the immutable base checkpoint in vLLM, then sync only LoRA.
    # Dummy-load previously exhausted host RAM before the first update.
    - "actor_rollout_ref.rollout.load_format=safetensors"
    - "actor_rollout_ref.rollout.layered_summon=true"

# UNVALIDATED — planned scale-up (2 TP2 engine replicas, FSDP over 4).
# Smoke before first paid use; per-GPU numbers copied from 2xB200.
4xB200:
  n_gpus: 4
  rollout_tp: 2
  gpu_memory_utilization: 0.42
  extra_overrides:
    - "++actor_rollout_ref.rollout.engine_kwargs.vllm.disable_custom_all_reduce=true"

# Validated for the 32B TP2 arms (util 0.42 sized against the 141GB card —
# the 0.50 attempt died at rollout boot, 2026-08-08).
2xH200:
  n_gpus: 2
  rollout_tp: 2
  gpu_memory_utilization: 0.42
  extra_overrides:
    - "++actor_rollout_ref.rollout.engine_kwargs.vllm.disable_custom_all_reduce=true"
    - "actor_rollout_ref.rollout.load_format=safetensors"
    - "actor_rollout_ref.rollout.layered_summon=true"

# Validated by the CodeContests OLMo-3.1-32B cap2048 smoke on 2026-08-13.
# 0.40 x 80GB leaves room for TP4 weights and KV cache while the FSDP side
# remains below the observed 42-45GB reserved peak. The cap arms explicitly
# select 0.40 as well; keeping it here makes auto-detection fail-safe for the
# same proven hardware profile.
4xH100:
  n_gpus: 4
  rollout_tp: 4
  gpu_memory_utilization: 0.40
  extra_overrides:
    - "++actor_rollout_ref.rollout.engine_kwargs.vllm.disable_custom_all_reduce=true"
