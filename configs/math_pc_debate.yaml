# MATH proposer-critic debate RL.
# Flow: proposal (public, graded) -> critique -> alice_rebuttal ->
# bob_rebuttal (critic's last word, as in the old PC arm) -> judge
# deliberation (private) + verdict. Turns 2 and 3 are ONE move — defend your
# own argument, rebut the other's — so they are named for their speaker.
# Run: debate-rl --experiment-file configs/math_pc_debate.yaml --experiment <name>

# Objective shared with the RLVR arm (configs/_qwen35_training.yaml).
# Only the Qwen3.5 cispo arm below extends it; the ppo/gspo/reinforce
# arms keep _base_math_pc's own loss.
_includes: [_qwen35_training.yaml]

_base_math_pc:
  protocol:
    # EVERY trained slot of a thinking seat carries max_think_tokens. Without
    # one there is no budget forcing, so a 4B spends the whole slot reasoning,
    # never emits </think>, and the speech that reaches the judge is either
    # empty or (before the round._split_think fix) the raw scratchpad. The
    # think cap is what guarantees the seat still gets to speak.
    turns:
      - alice: [{name: proposal, kind: solution, max_think_tokens: 1024, max_total_tokens: 3072}]
      - bob:   [{name: critique, max_think_tokens: 768, max_total_tokens: 1536}]
      - alice: [{name: alice_rebuttal, max_think_tokens: 768, max_total_tokens: 1536}]
      - bob:   [{name: bob_rebuttal,   max_think_tokens: 768, max_total_tokens: 1536}]
      - judge: [{name: deliberation, visibility: private, max_total_tokens: 768},
                {name: verdict, kind: decision, max_total_tokens: 256}]
  prompt_config:
    file_path: infra/prompts/debate/hendrycks_math.yaml
    entry: math_proposer_critic
  fresh_positions: true
  agents:
    alice:
      trained: true
      model_settings:
        model_type: tinker
        model_file_path: Qwen/Qwen3.5-4B
        alias: proposer-alice
        enable_thinking: true
        sampling: {train: {temperature: 1.0, top_p: 1.0}}
    bob:
      trained: true
      model_settings:
        model_type: tinker
        model_file_path: Qwen/Qwen3.5-4B
        alias: critic-bob
        enable_thinking: true
        # trained seats sample UNBIASED (1.0/1.0): sampler logprobs anchor the
        # PPO ratio; the runner hard-rejects anything else
        sampling: {train: {temperature: 1.0, top_p: 1.0}}
    judge:
      model_settings:
        model_type: tinker
        model_file_path: Qwen/Qwen3.5-4B
        alias: judge
        enable_thinking: false
        # temp/top_p 1.0: the logit confidence channel is only honest here
        sampling: {train: {temperature: 1.0, top_p: 1.0}}
  judge_config: {schema_name: competitive, retries: 4}
  scoring:
    scoring: continuous
    confidence_source: json
    shaping:
      # +0.1 on the proposal DATUM (not the whole trajectory) when the answer
      # had a valid answer format — trajectory-specific reward via per-datum GRPO.
      - {name: proposal_format, kind: format_reward, coeff: 0.1, slots: [proposal], flag: answer_format_valid}
  # L3-4: the contested band for a 4B (L1-2 ran 71-88% correct -> debates
  # uncontested; L5-only sits near the always-wrong floor at this scale, the
  # old repo's own warning). L5 arm below for harder runs / the 9B.
  dataset: {type: math, levels: "3-4", relaxed_extraction: true, seed: 0}
  training:
    # The TEAM, not the api key's personal default entity — without this,
    # runs land in whoever launched them's own namespace and the rest of
    # the team cannot see them.
    wandb_entity: palaestra-research
    wandb_project: debate-math
    lora_rank: 32   # the SHARED adapter's rank (one adapter across all trained seats)
    loss: {kind: ppo, clip_low: 0.8, clip_high: 1.2}   # GRPO = this + group-normalized advantages
    ppo_epochs: 1
    # equal gradient mass per (seat, debate): a seat with more slots or bigger
    # token budgets gets no extra pull on the shared self-play adapter
    adv_length_norm: trajectory
    steps: 100
    batch_size: 8
    group_size: 4
    lr: 1.0e-5
    kl_coef: 0.02
    eval_every: 5      # RLVR eval: greedy MathEnv accuracy on the held-out test split
    eval_n: 32
    eval_max_tokens: 3072
    save_every: 50

# 2-step live verification arm: tiny sizes, no eval/save.
math_pc_smoke:
  _extends: _base_math_pc
  training:
    steps: 2
    batch_size: 2
    group_size: 2
    eval_every: 0
    save_every: 0

# The elicited-confidence arm.
math_pc_debate:
  _extends: _base_math_pc

# The judge-logit arm (the old MATH_Debate_Logit comparison): one-line diff.
math_pc_debate_logit:
  _extends: _base_math_pc
  scoring:
    confidence_source: logit

# Solo-proposal arm: the proposal is generated in the task source's own RLVR
# context — no debate framing — so this arm and the RLVR baseline share ONE
# proposal distribution and differ only in reward channel. Later turns
# (alice_rebuttal) are debate-aware as usual.
math_pc_solo:
  _extends: _base_math_pc
  first_speech_non_debate_aware: true

# Loss ablations: same debate, different objective.
math_pc_reinforce:
  _extends: _base_math_pc
  training:
    loss: {kind: reinforce}

math_pc_grpo_2epoch:
  _extends: _base_math_pc
  training:
    ppo_epochs: 2

# GSPO: sequence-level ratio via tinker forward_backward_custom. Sequence
# ratios concentrate near 1 — clips are MUCH tighter than PPO's (paper values).
math_pc_gspo:
  _extends: _base_math_pc
  training:
    loss: {kind: gspo, clip_low: 0.9997, clip_high: 1.0004}
    # gspo is already one loss term per sequence; seat balance = count only
    adv_length_norm: count

# MATH level-5 only: bigger proposal budgets (L5 derivations truncate at 3072).
# Expect low proposal accuracy on a 4B; intended for the 9B or curriculum end.
math_pc_l5:
  _extends: _base_math_pc
  protocol:
    # think 4000 + answer 1024, exactly the RLVR arm's think_tokens +
    # max_completion_tokens: the proposal is the same generation the RLVR
    # baseline makes on the same problem. At 2048 the close landed mid
    # derivation and the public proposal opened on the tail of a cut-off
    # calculation. Lists deep-merge BY INDEX, so this replaces turn 0 only.
    #
    # Past the opening pair the caps are SPEECH budgets, not reasoning
    # budgets. At the base's max_think 768 the reply slots were force-closed
    # on nearly every sample and phase 2 published the unfinished scratchpad
    # as the speech. The replies render with enable_thinking false and no
    # think cap (null clears the parent's: a child cannot delete a key), so
    # max_total_tokens IS the speech.
    #
    # The critique is an OPENING speech and keeps the proposal's 4000-token
    # think phase; only its speech is capped, through max_visible_tokens.
    # total = 4000 think + 2 forced-close tokens + 320 speech, rounded up.
    #
    # 320 tokens is the ceiling under the cue's 150-WORD limit, not the limit
    # itself: LaTeX-dense speech ran ~1.6 tokens/word in a live rollout, so a
    # compliant 150 words finishes well inside it and only a speech that
    # ignores the cue runs out. Running out is what scoring.shaping prices.
    turns:
      - alice: [{name: proposal, kind: solution, max_think_tokens: 4000, max_total_tokens: 5024}]
      - bob:   [{name: critique, max_think_tokens: 4000, max_visible_tokens: 320, max_total_tokens: 4352}]
      - alice: [{name: alice_rebuttal, enable_thinking: false, max_think_tokens: null, max_total_tokens: 320}]
      - bob:   [{name: bob_rebuttal,   enable_thinking: false, max_think_tokens: null, max_total_tokens: 320}]
  dataset: {type: math, levels: 5, relaxed_extraction: true, seed: 0}
  # Budget-overshoot parity with the RLVR arm, which prices a force-closed
  # think phase at -0.1 via dataset.think_overshoot_penalty. That key is read
  # by MathEnv.reward_sample, which a debate never reaches, so it was inert
  # here at any value — and base Qwen3.5-4B is force-closed on 99.3% of
  # rollouts, so only the RLVR arm was paid to terminate and box. It belongs on
  # this arm because the 4000 think cap above is what makes a slot
  # overshootable. Index 0 is restated byte-identically from _base_math_pc
  # (lists deep-merge BY INDEX); edit the two together.
  scoring:
    shaping:
      - {name: proposal_format, kind: format_reward, coeff: 0.1, slots: [proposal], flag: answer_format_valid}
      - {name: proposal_think_overshoot, kind: think_overshoot_penalty, coeff: 0.1, slots: [proposal], flag: think_overshoot}
      # Per-speech budget pricing on the non-solution turns, after Kenton et
      # al. (2608.17776 §3.4): the word limit is stated in the cue AND paid for
      # in the reward. Flat, on the same 0.1 as the overshoot terms: the
      # feature is "this speech ran out of budget", so a speech that fits pays
      # nothing however long it is, and one that is cut mid-sentence pays once.
      # The proposal is exempt, as Alice's solution turn is there.
      - {name: reply_truncation, kind: speech_overshoot_penalty, coeff: 0.1, flag: truncated,
         slots: [critique, alice_rebuttal, bob_rebuttal]}

# ---------------------------------------------------------------------------
# Scheduler workload — fresh-start Qwen3.5 L5 CISPO debate on verl.
#
# Why verl rather than the tinker seats every other arm here uses: the
# scheduler-owned runtime is verl/FSDP LoRA, and
# infra/backend/tinker.py's load() takes a Tinker service state
# (`create_training_client_from_state_with_optimizer`), not a local checkpoint
# directory. Backend and seat model_type are coupled by
# run_debate.BACKEND_MODEL_TYPES ({"verl": ModelType.LOCAL}), so the trained
# seats declare `local` and are served through verl's OpenAI shim. Structure
# follows math_pc_olmo_l5_g8, the proven debate+verl arm.
#
# The scheduler launch is an exact fresh Qwen/Qwen3.5-4B start: no checkpoint
# input, --load, --start-step, or --wandb-resume. The checkpoint directory
# below is output-only for this run.
#
# Dataset is the UNFILTERED L5 pool (no train_filter_file), i.e. the same pool
# mathl5_qwen35_cispo trained on — not the l5_nonzero/sub8/solveband carves.
mathl5_qwen35_pc_debate_cispo_verl:
  # Protocol from math_pc_l5; objective from the shared base (later parent
  # wins), so loss/kl_coef cannot drift from the RLVR arm.
  _extends: [math_pc_l5, _qwen35_train_base]
  # Proposal USER MESSAGE, byte-identical to the RLVR arm's rollout prompt:
  # the pack's <ANSWER_GEN_USER> splice renders this file into the proposal
  # slot, so with math.yaml here the two arms would differ in prompt as well as
  # in protocol, and neither arm's dev curve could be attributed.
  #
  # The SYSTEM CARD still differs, and deliberately is not claimed to match:
  # first_speech_non_debate_aware defaults False (infra/envs/debate/env.py), so
  # the proposer generates knowing a critic is coming. math_pc_solo is the arm
  # that closes that gap; this is not it. State the layer a claim holds at.
  dataset: {prompt_file: infra/prompts/tasks/math_nocot.yaml}
  # dev/test instrument, byte-identical to mathl5_qwen35_cispo's eval_dataset
  # in configs/math_qwen35.yaml — change the two together or the arms stop
  # being comparable. AMC discriminates where the L5 dev carve saturates.
  eval_dataset: {type: amc, prompt_file: infra/prompts/tasks/math_nocot.yaml, think_overshoot_penalty: 0.1}
  # The RLVR arm derives these from think_tokens 4000 + max_completion_tokens
  # 1024; debate slot budgets never reach the eval env, so it states them.
  # Without them the eval generates single-phase to eval_max_tokens and every
  # sample still thinking at the cap is graded as a wrong answer.
  eval_slot_limits: {max_think_tokens: 4000, max_total_tokens: 5024}
  agents:
    alice:
      trained: true
      model_settings:
        model_type: local
        model_file_path: Qwen/Qwen3.5-4B
        alias: proposer-alice
        enable_thinking: true
        sampling: {train: {temperature: 1.0, top_p: 1.0}}
    bob:
      trained: true
      model_settings:
        model_type: local
        model_file_path: Qwen/Qwen3.5-4B
        alias: critic-bob
        enable_thinking: true
        sampling: {train: {temperature: 1.0, top_p: 1.0}}
    judge:
      model_settings:
        model_type: local
        model_file_path: Qwen/Qwen3.5-4B
        alias: judge
        base_url: http://127.0.0.1:8788/v1
        enable_thinking: false
        sampling: {train: {temperature: 1.0, top_p: 1.0}}
  training:
    backend: verl
    # Match the Qwen3.5 RLVR arm's CISPO objective while keeping the debate
    # protocol/reward channel as the intervention.
    # loss and kl_coef now come from _qwen35_train_base — do not restate them.
    #
    # OVERRIDES BELOW MUST SAY WHY. Everything here is either protocol-forced
    # or a pending decision; an override without a reason is drift.
    #
    verl:
      n_gpus: 2
      strategy: fsdp2
      # One TP1 rollout replica per B200; training remains FSDP2 across both.
      rollout_tp: 1
      checkpoint_dir: /workspace/checkpoints
      # 0.33 not math_qwen35's 0.45: the standalone frozen 4B judge reserves
      # ~0.18 on its selected GPU, exactly as math_pc_olmo_l5_g8 documents.
      gpu_memory_utilization: 0.33
      # Derived, not guessed. run_debate.debate_gen_budgets cross-checks
      # response_length against every TRAINED seat's slot cap, and the largest
      # is the proposal at 5024 (math_pc_l5); critique/alice_rebuttal/bob_rebuttal are
      # 1536 and the judge is excluded (it generates on its own vLLM, so
      # response_length cannot truncate it). 5120, not 5024: the same check
      # covers training.eval_max_tokens, and the eval budget is shared with
      # the RLVR arm — matching the RLVR arm's own response_length.
      response_length: 5120
      # Worst-case trained-seat context is bob's REBUTTAL, the last trained
      # generation, which sees base + proposal + critique + alice_rebuttal. Thinking
      # never enters it -- round.py:63, "stored; NEVER rendered into any
      # context" -- so think budgets do not compound across turns. Each speech
      # counts its FULL slot cap: a think phase that closes early leaves the
      # rest of the budget to visible text.
      #   base (system + L5 problem)        ~2144  (math_qwen35 prompt_length
      #                                             6144 - think_tokens 4000)
      #   proposal  visible worst case       5024
      #   critique  (max_visible_tokens)      320
      #   alice_rebuttal                      320
      #                                    -------
      #                                      7808
      # The reply slots now cap SPEECH, not the slot total, so what a later
      # context can carry shrank. 11264 is kept as the ceiling: the memory
      # envelope below is what a change here would have to re-smoke.
      prompt_length: 11264
      # prompt_length + response_length (11264 + 5024 = 16288). NEEDS A SMOKE:
      # this is the per-GPU memory envelope, including the GPU selected by the
      # standalone judge.
      max_token_len_per_gpu: 16384
      extra_overrides:
        # LOAD-BEARING, per math_qwen35.yaml: adapter-name sync crashes on the
        # VL wrapper's vision tower and silently drops LoRA on GDN in_proj_a/b
        # (vllm#38085). Do not remove without a passing smoke.
        - "++actor_rollout_ref.model.lora.merge=True"
    lora_rank: 32   # one shared rank-32 adapter across both trained seats

# Debate on the sub8 carve. Ethan, 2026-08-26.
#
# Pairs with mathl5_qwen35_cispo_sub8 (wandb 5ib0lvxe, 200 steps): that is the
# only COMPLETED filtered RLVR arm, so sub8 is what makes this debate arm
# comparable to anything. The l5_nonzero carve would pair with nothing —
# mathl5_qwen35_cispo_filtered has never been launched.
#
# This deliberately departs from the parent's "UNFILTERED L5 pool" note above,
# which exists to pair with mathl5_qwen35_cispo (hqsmdq5c). Filtering is NOT
# motivated by zero-advantage waste on this side: the debate arm drops ~0.6% of
# datums (2 of 248 on 0s44ib3q) because judge verdicts vary even on rows the
# proposer never solves. It is here only to match the baseline's pool.
#
# train_filter_file is honored on the debate path — MathFamily.source() applies
# it before DebateEnv ever calls .tasks(), verified 1600 -> 1321 train rows with
# dev/test untouched. Unlike dataset.think_overshoot_penalty (see above), this
# dataset key is NOT inert here.
#
# Overshoot is priced through scoring.shaping, inherited from math_pc_l5.
mathl5_qwen35_pc_debate_cispo_verl_sub8:
  _extends: mathl5_qwen35_pc_debate_cispo_verl
  dataset: {train_filter_file: configs/filters/l5_sub8_qwen35.json}

# Warm-started counterpart of the sub8 arm. Ethan, 2026-08-27.
#
# alice and bob start from the format warmup folded into base weights:
# qwen35_fmt_warmup_l3, ORIGINAL lineage `final` (step 40). Held-out AMC at
# that checkpoint is fmt .747 / correct_strict .711 against base .530/.530.
#
# Step 40 and not later: format plateaued there (.783/.795/.771 at steps 40/50/60
# are within half a standard error of each other on n=83) while correctness fell
# monotonically to .542, because this arm's reward is format ONLY
# (correct_reward 0.0) and nothing in it protects the answer. Conditional
# accuracy -- correct given a valid box -- went .95 -> .86 -> .76 -> .70 across
# those same evals. The later checkpoints buy formatting with arithmetic, which
# is the opposite of what a debate arm needs.
#
# The JUDGE stays on stock Qwen/Qwen3.5-4B, deliberately. Its verdict IS the
# reward channel here, so warming it would change the reward function rather
# than the policy, and no earlier debate arm would remain comparable.
#
# model_file_path is a POD-LOCAL path, not an HF repo id. The launching jobd
# spec ships the 913MB LoRA checkpoint in as a declared input and merges it into
# base at the top of the command; scripts/merge_lora_ckpt.py writes exactly this
# directory. Merging is not a convenience over --load: adapter-mode vLLM
# silently drops LoRA on GDN in_proj_a/b for Qwen3.5 (vllm#38085), which is the
# same defect the inherited "++actor_rollout_ref.model.lora.merge=True" override
# exists for. A warmup adapter loaded rather than merged would be partly absent
# from the rollouts it is supposed to shape.
mathl5_qwen35_pc_debate_cispo_verl_sub8_warm:
  _extends: mathl5_qwen35_pc_debate_cispo_verl_sub8
  agents:
    alice:
      model_settings:
        model_file_path: /workspace/models/qwen35-fmt-warmup-l3-s40
    bob:
      model_settings:
        model_file_path: /workspace/models/qwen35-fmt-warmup-l3-s40

# Kenton word limit priced PROPORTIONALLY, from vanilla Qwen. Ethan, 2026-08-27.
#
# Two changes from the sub8 parent, both about how length is priced.
#
# 1. The word limit becomes proportional to the excess, which is what Kenton et
#    al. (2608.17776 3.4) actually specify: "a soft additive penalty
#    proportional to the excess". The inherited speech_overshoot_penalty gates
#    on `truncated`, so under the cue's 150-word limit and a 320-token ceiling
#    it fires only at the ceiling -- a 200-word speech paid nothing, the same as
#    a 140-word one, while a speech cut mid-sentence paid the whole 0.1. The
#    limit was stated in the cue and then priced at a threshold ~50 words past
#    it. It is set to 0.0 here rather than deleted because scoring.shaping is a
#    list and lists deep-merge BY INDEX; a kind swapped in at an occupied index
#    would inherit the old entry's `flag` key.
#
#    coeff 0.002/word is calibrated to the term it replaces: the 320-token cap
#    is ~200 words at the 1.6 tokens/word this protocol's LaTeX-dense speech
#    measured, so a speech at the cap is ~50 words over and pays ~0.1, the
#    flat term's old price. Below the limit the term is exactly zero, so it
#    prices exceeding a budget and never rewards brevity for its own sake.
#
# 2. think_overshoot_penalty on the proposal goes to 0.0. Kenton exempts the
#    solution turn, and on 2026-08-27 this term is what broke the RLVR arm:
#    being flat, it contributes to a CISPO advantage only through its variance
#    inside the group, so it drove length down until train/think_overshoot hit
#    0.000 at step 32 and then went inert, leaving the policy in a short regime
#    with nothing holding it there. Held-out correctness fell .699 -> .530 while
#    21.9% of step-49 rollouts were repetition loops emitting `</think>` 37x.
#
# Starts from stock Qwen/Qwen3.5-4B: no model_file_path override, so this does
# NOT inherit the fmt-warmup checkpoint the _warm arms used.
mathl5_qwen35_pc_debate_cispo_verl_sub8_kenton:
  _extends: mathl5_qwen35_pc_debate_cispo_verl_sub8
  scoring:
    shaping:
      - {name: proposal_format, kind: format_reward, coeff: 0.1, slots: [proposal], flag: answer_format_valid}
      - {name: proposal_think_overshoot, kind: think_overshoot_penalty, coeff: 0.0, slots: [proposal], flag: think_overshoot}
      - {name: reply_truncation, kind: speech_overshoot_penalty, coeff: 0.0, flag: truncated,
         slots: [critique, alice_rebuttal, bob_rebuttal]}
      # mode is stated rather than left to the default: it is the whole
      # intervention, and `mode: flat` at coeff 0.1 reproduces the behaviour
      # this arm exists to replace, which makes the ablation a one-word edit.
      - {name: reply_word_budget, kind: budget_penalty, coeff: 0.002, limit: 150, mode: proportional,
         slots: [critique, alice_rebuttal, bob_rebuttal]}

# Debate warm-started from the RLVR control's step 20. Ethan, 2026-08-27.
#
# WHY THIS ARM EXISTS: the cold Kenton debate arm did not move in ten steps --
# dev truncation sat at .482 at both step 0 and step 10 while the RLVR control
# on the same proposal distribution went .494 -> .253 over the same span. A
# judge verdict appears to be too blunt a teacher for "close your think phase":
# a proposal cut off mid-derivation and one that is complete but wrong both
# simply lose, where RLVR pays 0.1 for the box itself. So this arm hands debate
# a policy that already finishes and asks whether it can then learn the thing
# it is actually for.
#
# STEP 20 AND NOT 40, deliberately: 40 is the better model (fmt .988/corr .771/
# trunc .000 against 20's .964/.711/.024) but it is 40 steps deep into the RLVR
# objective, and the more saturated the start the less room debate has to show
# an effect distinguishable from further RLVR. Step 20 is past the truncation
# problem (.024) without being optimised much beyond it.
#
# THE CONTROL IS FREE: mathl5_qwen35_cispo_sub8_kenton continues past step 20 on
# its own pod, so debate-from-s20 at step N compares against RLVR at step 20+N
# -- same starting parameters, same number of subsequent steps, only the
# objective differs. That is a cleaner isolation than either arm against a cold
# start, and it costs nothing extra.
#
# The JUDGE stays on stock Qwen/Qwen3.5-4B. Its verdict IS the reward channel,
# so warming it would change the reward function rather than the policy.
#
# model_file_path is a POD-LOCAL path. The launching jobd spec ships the 950MB
# step-20 LoRA checkpoint in as a declared input and merges it into base at the
# top of the command. Merging rather than continuing the adapter is what makes
# the comparison well-posed: a continued adapter has the debate gradient
# rewriting the same parameters that encode the RLVR behaviour, so a later drop
# in correctness could not be told apart from debate eating its own warm start.
# It also leaves the full rank-32 adapter free for debate-specific learning.
# NOTE this checkpoint is FSDP2-SHARDED across 2 ranks (the RLVR arm trains on
# 2 GPUs); scripts/merge_lora_ckpt.py reassembles the DTensors, and reading
# rank 0 alone would merge half of every LoRA matrix without erroring.
mathl5_qwen35_pc_debate_cispo_verl_sub8_kenton_rlvrs20:
  _extends: mathl5_qwen35_pc_debate_cispo_verl_sub8_kenton
  agents:
    alice:
      model_settings:
        model_file_path: /workspace/models/qwen35-rlvr-sub8-s20
    bob:
      model_settings:
        model_file_path: /workspace/models/qwen35-rlvr-sub8-s20

# Cold-start debate with a PROPORTIONAL budget on the proposal. Ethan, 2026-08-27.
#
# The other attack on the same stall. Where the _rlvrs20 arm above hands debate
# a policy that already finishes, this one gives debate the reward pressure to
# learn finishing itself, from stock Qwen/Qwen3.5-4B.
#
# The budget is on TOTAL, not think: total length is what actually truncates
# (the proposal slot caps at 5024) and pricing the total lets the policy choose
# its own split between reasoning and answer rather than being told where to
# save. limit 4000 against an observed dev mean of 4818 means most proposals
# start out over it -- which is the point. A FLAT term would then be nearly
# constant across a group and the baseline would remove it, exactly how the old
# think_overshoot_penalty went inert; proportional keeps 200-vs-1024 tokens of
# excess distinguishable, so there is gradient the whole way down.
#
# coeff 0.0002: a proposal pinned at the 5024 cap pays 0.205 against a +/-1
# ladder, ~10% of the win-loss span. Below 4000 the term is exactly zero, so
# this prices overrun and never rewards brevity for its own sake.
#
# Index 4 APPENDS to the parent's four shaping entries (lists deep-merge BY
# INDEX, and an index past the end appends). The word budget on the reply slots
# is inherited unchanged at index 3.
mathl5_qwen35_pc_debate_cispo_verl_sub8_kenton_propbudget:
  _extends: mathl5_qwen35_pc_debate_cispo_verl_sub8_kenton
  scoring:
    shaping:
      - {name: proposal_format, kind: format_reward, coeff: 0.1, slots: [proposal], flag: answer_format_valid}
      - {name: proposal_think_overshoot, kind: think_overshoot_penalty, coeff: 0.0, slots: [proposal], flag: think_overshoot}
      - {name: reply_truncation, kind: speech_overshoot_penalty, coeff: 0.0, flag: truncated,
         slots: [critique, alice_rebuttal, bob_rebuttal]}
      - {name: reply_word_budget, kind: budget_penalty, coeff: 0.002, limit: 150, mode: proportional,
         slots: [critique, alice_rebuttal, bob_rebuttal]}
      - {name: proposal_token_budget, kind: budget_penalty, coeff: 0.0002, limit: 4000, mode: proportional,
         counts: total, slots: [proposal]}

# Proposal -> critique -> judge: the rebuttal round removed. `null` deletes a
# speaker's slots; declaring fewer turns would leave the parent's in place,
# since turns are positional records and still merge by index.
#
# Alice never answers the critique, and under the current cue Bob attacks
# every proposal including correct ones. So this asks whether the judge can
# tell a sound attack from a manufactured one unaided.
math_pc_no_rebuttals:
  _extends: mathl5_qwen35_pc_debate_cispo_verl_sub8_kenton
  protocol:
    turns:
      - {}
      - {}
      - alice: null
      - bob: null
  scoring:
    # Narrowing `slots` in place would merge by index and leave the deleted
    # slots behind, so the inherited term is dropped and restated.
    shaping:
      - {name: reply_truncation, _drop: true}
      - {name: reply_word_budget, _drop: true}
      - {name: critique_word_budget, kind: budget_penalty, coeff: 0.002,
         limit: 150, mode: proportional, slots: [critique]}

# No-rebuttals debate warm-started from the RLVR control's step 130, with a
# proportional budget on the proposal. Ethan, 2026-08-28.
#
# The combination neither earlier arm had: rlvrs20 warm-started but left the
# solution turn unpriced and its truncation eroded .024 -> .145 in 20 steps;
# propbudget priced the proposal but started cold. The format reward cannot
# substitute -- answer_format_valid is satisfied by a sample that boxes and
# then truncates, which is exactly what the control did at end-of-run.
#
# Step 130 and not 20: with the control finished, 130 is its best checkpoint
# (.783 correct, .000 truncated, full margin to the cap) where step 20 was
# .711/.024. Steps 190 and final sit inside the truncation blowup and must
# not be used.
mathl5_qwen35_pc_debate_norebut_propbudget_rlvr130:
  _extends: math_pc_no_rebuttals
  agents:
    alice:
      model_settings:
        model_file_path: /workspace/models/qwen35-rlvr-sub8-s130
    bob:
      model_settings:
        model_file_path: /workspace/models/qwen35-rlvr-sub8-s130
  scoring:
    shaping:
      - {name: proposal_token_budget, kind: budget_penalty, coeff: 0.0002,
         limit: 4000, mode: proportional, counts: total, slots: [proposal]}
