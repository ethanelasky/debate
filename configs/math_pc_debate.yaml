# MATH proposer-critic debate RL (format per DESIGN-pc-format.md).
# Flow: proposal (public, graded) -> critique -> defense -> rebuttal (critic's
# last word, as in the old PC arm) -> judge deliberation (private) + verdict.
# Run: debate-rl --experiment-file configs/math_pc_debate.yaml --experiment <name>

# Objective shared with the RLVR arm (configs/_qwen35_training.yaml).
# Only the Qwen3.5 cispo arm below extends it; the ppo/gspo/reinforce
# arms keep _base_math_pc's own loss.
_includes: [_qwen35_training.yaml]

_base_math_pc:
  protocol:
    turns:
      - alice: [{name: proposal, kind: solution, max_think_tokens: 1024, max_total_tokens: 3072}]
      - bob:   [{name: critique, max_total_tokens: 768}]
      - alice: [{name: defense,  max_total_tokens: 768}]
      - bob:   [{name: rebuttal, max_total_tokens: 768}]
      - judge: [{name: deliberation, visibility: private, max_total_tokens: 768},
                {name: verdict, kind: decision, max_total_tokens: 256}]
  prompt_config:
    file_path: infra/prompts/debate/hendrycks_math.yaml
    entry: math_proposer_critic
  fresh_positions: true
  agents:
    alice:
      trained: true
      model_settings:
        model_type: tinker
        model_file_path: Qwen/Qwen3.5-4B
        alias: proposer-alice
        enable_thinking: true
        sampling: {train: {temperature: 1.0, top_p: 1.0}}
    bob:
      trained: true
      model_settings:
        model_type: tinker
        model_file_path: Qwen/Qwen3.5-4B
        alias: critic-bob
        enable_thinking: true
        # trained seats sample UNBIASED (1.0/1.0): sampler logprobs anchor the
        # PPO ratio; the runner hard-rejects anything else
        sampling: {train: {temperature: 1.0, top_p: 1.0}}
    judge:
      model_settings:
        model_type: tinker
        model_file_path: Qwen/Qwen3.5-4B
        alias: judge
        enable_thinking: false
        # temp/top_p 1.0: the logit confidence channel is only honest here
        sampling: {train: {temperature: 1.0, top_p: 1.0}}
  judge_config: {schema_name: competitive, retries: 4}
  scoring:
    scoring: continuous
    confidence_source: json
    shaping:
      # +0.1 on the proposal DATUM (not the whole trajectory) when the answer
      # had a valid answer format — trajectory-specific reward via per-datum GRPO.
      - {kind: format_reward, coeff: 0.1, slots: [proposal], flag: answer_format_valid}
  # L3-4: the contested band for a 4B (L1-2 ran 71-88% correct -> debates
  # uncontested; L5-only sits near the always-wrong floor at this scale, the
  # old repo's own warning). L5 arm below for harder runs / the 9B.
  dataset: {type: math, levels: "3-4", relaxed_extraction: true, seed: 0}
  training:
    # The TEAM, not the api key's personal default entity — without this,
    # runs land in whoever launched them's own namespace and the rest of
    # the team cannot see them.
    wandb_entity: palaestra-research
    wandb_project: debate-math
    lora_rank: 32   # the SHARED adapter's rank (one adapter across all trained seats)
    loss: {kind: ppo, clip_low: 0.8, clip_high: 1.2}   # GRPO = this + group-normalized advantages
    ppo_epochs: 1
    # equal gradient mass per (seat, debate): a seat with more slots or bigger
    # token budgets gets no extra pull on the shared self-play adapter
    adv_length_norm: trajectory
    steps: 100
    batch_size: 8
    group_size: 4
    lr: 1.0e-5
    kl_coef: 0.02        # centered-k1 advantage penalty vs frozen base
    kl_discount_factor: 0.0
    eval_every: 5      # RLVR eval: greedy MathEnv accuracy on the held-out test split
    eval_n: 32
    eval_max_tokens: 3072
    save_every: 50

# 2-step live verification arm: tiny sizes, no eval/save.
math_pc_smoke:
  _extends: _base_math_pc
  training:
    steps: 2
    batch_size: 2
    group_size: 2
    eval_every: 0
    save_every: 0

# The elicited-confidence arm.
math_pc_debate:
  _extends: _base_math_pc

# The judge-logit arm (the old MATH_Debate_Logit comparison): one-line diff.
math_pc_debate_logit:
  _extends: _base_math_pc
  scoring:
    confidence_source: logit

# Solo-proposal arm (DESIGN-pc-format.md row 10): the proposal is generated in
# the task source's own RLVR context — no debate framing — so this arm and the
# RLVR baseline share ONE proposal distribution and differ only in reward
# channel. Later turns (defense) are debate-aware as usual.
math_pc_solo:
  _extends: _base_math_pc
  first_speech_non_debate_aware: true

# Loss ablations: same debate, different objective.
math_pc_reinforce:
  _extends: _base_math_pc
  training:
    loss: {kind: reinforce}

math_pc_grpo_2epoch:
  _extends: _base_math_pc
  training:
    ppo_epochs: 2

# GSPO: sequence-level ratio via tinker forward_backward_custom. Sequence
# ratios concentrate near 1 — clips are MUCH tighter than PPO's (paper values).
math_pc_gspo:
  _extends: _base_math_pc
  training:
    loss: {kind: gspo, clip_low: 0.9997, clip_high: 1.0004}
    # gspo is already one loss term per sequence; seat balance = count only
    adv_length_norm: count

# MATH level-5 only: bigger proposal budgets (L5 derivations truncate at 3072).
# Expect low proposal accuracy on a 4B; intended for the 9B or curriculum end.
math_pc_l5:
  _extends: _base_math_pc
  protocol:
    turns:
      - alice: [{name: proposal, kind: solution, max_think_tokens: 2048, max_total_tokens: 6144}]
  dataset: {type: math, levels: 5, relaxed_extraction: true, seed: 0}

# ---------------------------------------------------------------------------
# Scheduler workload — fresh-start Qwen3.5 L5 CISPO debate on verl.
#
# Why verl rather than the tinker seats every other arm here uses: the
# scheduler-owned runtime is verl/FSDP LoRA, and
# infra/backend/tinker.py's load() takes a Tinker service state
# (`create_training_client_from_state_with_optimizer`), not a local checkpoint
# directory. Backend and seat model_type are coupled by
# run_debate.BACKEND_MODEL_TYPES ({"verl": ModelType.LOCAL}), so the trained
# seats declare `local` and are served through verl's OpenAI shim. Structure
# follows math_pc_olmo_l5_g8, the proven debate+verl arm.
#
# The scheduler launch is an exact fresh Qwen/Qwen3.5-4B start: no checkpoint
# input, --load, --start-step, or --wandb-resume. The checkpoint directory
# below is output-only for this run.
#
# Dataset is the UNFILTERED L5 pool (no train_filter_file), i.e. the same pool
# mathl5_qwen35_cispo trained on — not the l5_nonzero/sub8/solveband carves.
mathl5_qwen35_pc_debate_cispo_verl:
  # Protocol from math_pc_l5; objective from the shared base (later parent
  # wins), so loss/kl_coef cannot drift from the RLVR arm.
  _extends: [math_pc_l5, _qwen35_train_base]
  agents:
    alice:
      trained: true
      model_settings:
        model_type: local
        model_file_path: Qwen/Qwen3.5-4B
        alias: proposer-alice
        enable_thinking: true
        sampling: {train: {temperature: 1.0, top_p: 1.0}}
    bob:
      trained: true
      model_settings:
        model_type: local
        model_file_path: Qwen/Qwen3.5-4B
        alias: critic-bob
        enable_thinking: true
        sampling: {train: {temperature: 1.0, top_p: 1.0}}
    judge:
      model_settings:
        model_type: local
        model_file_path: Qwen/Qwen3.5-4B
        alias: judge
        base_url: http://127.0.0.1:8788/v1
        enable_thinking: false
        sampling: {train: {temperature: 1.0, top_p: 1.0}}
  training:
    backend: verl
    # Match the Qwen3.5 RLVR arm's CISPO objective while keeping the debate
    # protocol/reward channel as the intervention.
    # loss and kl_coef now come from _qwen35_train_base — do not restate them.
    #
    # OVERRIDES BELOW MUST SAY WHY. Everything here is either protocol-forced
    # or a pending decision; an override without a reason is drift.
    #
    # PENDING DECISION (not protocol-forced): the RLVR arm runs lr 1e-4 with a
    # cosine schedule, min_lr_ratio 0.2 and 10 warmup steps. This arm runs 1e-5
    # with none of them. A 10x lr gap is the largest unexplained difference
    # between the two arms — see the OPEN DIVERGENCES list in
    # configs/_qwen35_training.yaml.
    lr: 1.0e-5
    # PENDING DECISION: half the RLVR arm's rollouts per prompt (8 -> 4).
    group_size: 4
    verl:
      n_gpus: 2
      strategy: fsdp2
      # One TP1 rollout replica per B200; training remains FSDP2 across both.
      rollout_tp: 1
      checkpoint_dir: /workspace/checkpoints
      # 0.33 not math_qwen35's 0.45: the standalone frozen 4B judge reserves
      # ~0.18 on its selected GPU, exactly as math_pc_olmo_l5_g8 documents.
      gpu_memory_utilization: 0.33
      # Derived, not guessed. run_debate.debate_gen_budgets cross-checks
      # response_length against every TRAINED seat's slot cap, and the largest
      # is the proposal at 6144 (math_pc_l5); critique/defense/rebuttal are 768
      # and the judge is excluded (it generates on its own vLLM, so
      # response_length cannot truncate it).
      response_length: 6144
      # Worst-case trained-seat context is bob's REBUTTAL, the last trained
      # generation, which sees base + proposal + critique + defense. Thinking
      # never enters it -- round.py:63, "stored; NEVER rendered into any
      # context" -- so think budgets do not compound across turns:
      #   base (system + L5 problem)        ~2144  (math_qwen35 prompt_length
      #                                             6144 - think_tokens 4000)
      #   proposal  visible worst case       6144
      #   critique                            768
      #   defense                             768
      #                                    -------
      #                                      9824  -> round up
      prompt_length: 10240
      # prompt_length + response_length. NEEDS A SMOKE: this is the per-GPU
      # memory envelope, including the GPU selected by the standalone judge.
      max_token_len_per_gpu: 16384
      extra_overrides:
        # LOAD-BEARING, per math_qwen35.yaml: adapter-name sync crashes on the
        # VL wrapper's vision tower and silently drops LoRA on GDN in_proj_a/b
        # (vllm#38085). Do not remove without a passing smoke.
        - "++actor_rollout_ref.model.lora.merge=True"
    lora_rank: 32   # one shared rank-32 adapter across both trained seats
