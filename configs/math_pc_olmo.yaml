# OLMo-3-7B-Instruct-DPO proposer-critic on MATH level 5, all-on-pod via verl.
# Thinking OFF; private scratchpad slots replace <think>: proposal turn gets
# 1000 plan + 1000 argument, later speeches 500 + 500, judge 1000 + verdict.
# Judge = frozen Qwen3.5-4B served by a local vLLM on the pod (see
# scripts/pod_run.sh). Standalone entry on purpose: protocol turn lists
# merge BY INDEX under _extends, which poisons mixed-shape protocols.
#
# Run (on the pod): debate-rl --experiment-file configs/math_pc_olmo.yaml --experiment math_pc_olmo_l5

math_pc_olmo_l5:
  protocol:
    turns:
      # `plan`, not `scratchpad`: the pre-proposal slot has its own cue
      # (spliced <PLAN_USER>) carrying the problem — the proposer has no
      # pre_debate preamble, so the generic scratchpad cue left alice
      # planning blind (2026-08-06). Later scratchpads keep the generic cue:
      # by then the problem/dispute is in context.
      - alice: [{name: plan, visibility: private, max_total_tokens: 1000},
                {name: proposal, kind: solution, max_total_tokens: 1000}]
      - bob:   [{name: scratchpad, visibility: private, max_total_tokens: 500},
                {name: critique, max_total_tokens: 500}]
      - alice: [{name: scratchpad, visibility: private, max_total_tokens: 500},
                {name: defense, max_total_tokens: 500}]
      - bob:   [{name: scratchpad, visibility: private, max_total_tokens: 500},
                {name: rebuttal, max_total_tokens: 500}]
      - judge: [{name: deliberation, visibility: private, max_total_tokens: 1000},
                {name: verdict, kind: decision, max_total_tokens: 256}]
  prompt_config:
    file_path: infra/prompts/debate/hendrycks_math.yaml
    entry: math_proposer_critic
  fresh_positions: true
  # RLVR evals run plan-then-answer (same shape as alice's plan slot, same
  # 1000-token cap) so the policy is measured in the mode it is trained in.
  plan_tokens: 1000
  agents:
    alice:
      trained: true
      model_settings:
        model_type: local            # served by the pod's verl rollout engine
        model_file_path: allenai/Olmo-3-7B-Instruct-DPO
        alias: proposer-alice
        sampling: {train: {temperature: 1.0, top_p: 1.0}}
    bob:
      trained: true
      model_settings:
        model_type: local
        model_file_path: allenai/Olmo-3-7B-Instruct-DPO
        alias: critic-bob
        sampling: {train: {temperature: 1.0, top_p: 1.0}}
    judge:
      model_settings:
        model_type: local
        model_file_path: Qwen/Qwen3.5-4B
        alias: judge
        base_url: http://127.0.0.1:8788/v1
        # temp/top_p 1.0: the logit confidence channel is only honest here
        sampling: {train: {temperature: 1.0, top_p: 1.0}}
  judge_config: {schema_name: competitive, retries: 4}
  scoring:
    scoring: continuous
    confidence_source: json
    shaping:
      - {kind: format_reward, coeff: 0.1, slots: [proposal], flag: strict_boxed}
  dataset: {type: math, levels: 5, relaxed_extraction: true, seed: 0}
  training:
    backend: verl
    verl:
      n_gpus: 1                      # H100/A100-80GB: 7B LoRA FSDP + colocated vllm + judge server
      # fsdp2 (fsdp1's full-state-dict weight sync OOMs next to the two vllm
      # procs). Needs the modeling_olmo3 rope x.dtype patch from
      # provision_pod.sh: transformers>=5.13 returns fp32 cos/sin, and FSDP2
      # skips its input pre-cast on checkpoint recompute (pytorch #159359)
      # -> CheckpointError without it.
      strategy: fsdp2
      # network volume: adapters are ~100-200MB with save_lora_only (which the
      # backend forces whenever lora_rank > 0)
      checkpoint_dir: /workspace/checkpoints
      gpu_memory_utilization: 0.33   # judge 0.18 + rollout 0.33 + 7B FSDP init peak must fit 80GB
      prompt_length: 8192
      response_length: 1024          # largest slot cap
      max_token_len_per_gpu: 16384
    # The TEAM, not the api key's personal default entity — without this,
    # runs land in whoever launched them's own namespace and the rest of
    # the team cannot see them.
    wandb_entity: palaestra-research
    wandb_project: debate-math
    lora_rank: 32
    loss: {kind: ppo, clip_low: 0.8, clip_high: 1.2}
    ppo_epochs: 1
    # count: per-seat mass balance WITHOUT the per-token division (verl's
    # token-mean loss already normalizes scale; trajectory-mode would shrink
    # advantages ~1000x and demand absurd lrs)
    adv_length_norm: count
    steps: 100
    batch_size: 8
    group_size: 4
    lr: 1.0e-5
    kl_coef: 0.02
    kl_discount_factor: 0.0
    eval_every: 5      # RLVR eval: greedy MathEnv accuracy on held-out L5 test
    eval_n: 256   # +-3.1pp binomial noise; 128 (+-4.4pp) made 3pp trends uncallable
    eval_max_tokens: 2000
    save_every: 25     # lora-only adapters (~100-200MB) on the network volume

# tiny live-verification arm
math_pc_olmo_smoke:
  _extends: math_pc_olmo_l5
  training:
    steps: 2
    batch_size: 2
    group_size: 4   # group 2 risks all-identical verdicts -> every datum dropped
    eval_every: 0
    save_every: 0

# Mirror of the successful math_rlvr_olmo_l5 run (wandb debate-rebuild,
# 2026-08-04, final eval 77.3%): group 8, lr 1e-4, and the proposal budget
# raised to RLVR's 2000-token completion cap — the post-ff3820c step-by-step
# answer prompt runs long, and 1000 truncated proposals would poison the judge
# signal. Standalone entry, same reason as math_pc_olmo_l5: protocol turn
# lists merge BY INDEX under _extends.
math_pc_olmo_l5_g8:
  protocol:
    turns:
      # plan (not scratchpad): see math_pc_olmo_l5's protocol comment.
      - alice: [{name: plan, visibility: private, max_total_tokens: 1000},
                {name: proposal, kind: solution, max_total_tokens: 2000}]
      - bob:   [{name: scratchpad, visibility: private, max_total_tokens: 500},
                {name: critique, max_total_tokens: 500}]
      - alice: [{name: scratchpad, visibility: private, max_total_tokens: 500},
                {name: defense, max_total_tokens: 500}]
      - bob:   [{name: scratchpad, visibility: private, max_total_tokens: 500},
                {name: rebuttal, max_total_tokens: 500}]
      - judge: [{name: deliberation, visibility: private, max_total_tokens: 1000},
                {name: verdict, kind: decision, max_total_tokens: 256}]
  prompt_config:
    file_path: infra/prompts/debate/hendrycks_math.yaml
    entry: math_proposer_critic
  fresh_positions: true
  # RLVR evals run plan-then-answer (same shape as alice's plan slot, same
  # 1000-token cap) so the policy is measured in the mode it is trained in.
  plan_tokens: 1000
  agents:
    alice:
      trained: true
      model_settings:
        model_type: local
        model_file_path: allenai/Olmo-3-7B-Instruct-DPO
        alias: proposer-alice
        sampling: {train: {temperature: 1.0, top_p: 1.0}}
    bob:
      trained: true
      model_settings:
        model_type: local
        model_file_path: allenai/Olmo-3-7B-Instruct-DPO
        alias: critic-bob
        sampling: {train: {temperature: 1.0, top_p: 1.0}}
    judge:
      model_settings:
        model_type: local
        model_file_path: Qwen/Qwen3.5-4B
        alias: judge
        base_url: http://127.0.0.1:8788/v1
        sampling: {train: {temperature: 1.0, top_p: 1.0}}
  judge_config: {schema_name: competitive, retries: 4}
  scoring:
    scoring: continuous
    confidence_source: json
    shaping:
      - {kind: format_reward, coeff: 0.1, slots: [proposal], flag: strict_boxed}
  dataset: {type: math, levels: 5, relaxed_extraction: true, seed: 0}
  training:
    backend: verl
    verl:
      n_gpus: 2                      # 2xH100 pod (4x had no US-CA-2 stock 2026-08-05);
                                     # judge still colocates on GPU 0 at 0.18
      strategy: fsdp2
      checkpoint_dir: /workspace/checkpoints
      gpu_memory_utilization: 0.33
      prompt_length: 8192
      response_length: 2048          # largest slot cap (proposal 2000)
      max_token_len_per_gpu: 16384
    wandb_project: debate-math
    lora_rank: 32
    loss: {kind: ppo, clip_low: 0.8, clip_high: 1.2}
    ppo_epochs: 1
    adv_length_norm: count
    steps: 100
    batch_size: 8
    group_size: 8      # as in math_rlvr_olmo_l5; halves advantage noise vs the g4 runs
    lr: 1.0e-4         # the RLVR lr that reached 77.3%; 1e-5 was dead here
    kl_coef: 0.02
    kl_discount_factor: 0.0
    eval_every: 5      # RLVR eval: greedy MathEnv accuracy on held-out L5 test
    eval_n: 256
    eval_max_tokens: 2000
    save_every: 25     # lora-only adapters (~100-200MB) on the network volume

# CoT-discovery arm: neutral prompt (math_nocot.yaml — no step-by-step ask, no
# answer-only ban). The nocot answer prompt splices into the proposal slot via
# <ANSWER_GEN_USER>, byte-identical to math_rlvr_olmo_l5_nocot's user message.
# Question: does judge-mediated debate reward discover derivations when the
# prompt is silent on them — and faster/higher than the verifier reward does?
math_pc_olmo_l5_g8_nocot:
  _extends: math_pc_olmo_l5_g8
  dataset: {type: math, levels: 5, relaxed_extraction: true, seed: 0, prompt_file: infra/prompts/tasks/math_nocot.yaml}

# OLMo-3-32B Think-DPO debate arm (Ethan, 2026-08-11). This is a controlled
# splice of two completed/live runs, not a new debate recipe:
#
#   debate protocol/dataset/reward: math_pc_olmo_l5_g8_nocot
#     W&B palaestra-research/debate-rebuild/bkih4xbk (latest completed debate)
#   optimizer recipe: aime_rlvr_olmo32think_cispo_os3
#     W&B palaestra-research/debate-math/zeaz96rn (live 32B run)
#
# _extends deliberately preserves the debate's five serial stages and every
# per-slot cap. The overrides below change only the shared policy checkpoint,
# 32B topology, and training recipe. gpu_memory_utilization stays at the
# debate-safe 0.33 rather than the judge-free RLVR run's 0.42: the frozen 4B
# judge reserves another 0.18 of GPU 0 on the same 183GB B200.
math_pc_olmo32think_cispo_os3:
  _extends: math_pc_olmo_l5_g8_nocot
  # The proposer's opening is a SOLO solution — rendered without any debate
  # context (Ethan, 2026-08-12): the opening must be the same distribution
  # the RLVR twin trains on; debate-awareness enters only from the critic's
  # first speech onward. Requires fresh_positions (inherited true).
  first_speech_non_debate_aware: true
  agents:
    alice:
      model_settings:
        model_file_path: allenai/Olmo-3-32B-Think-DPO
        enable_thinking: true
    bob:
      model_settings:
        model_file_path: allenai/Olmo-3-32B-Think-DPO
        enable_thinking: true
  training:
    wandb_entity: palaestra-research
    wandb_project: debate-math
    lora_rank: 32
    loss: {kind: cispo, clip_low: 0.8, clip_high: 1.28}
    ppo_epochs: 2
    adv_length_norm: none
    steps: 100
    batch_size: 8
    group_size: 8
    lr: 1.0e-4
    kl_coef: 0.02
    kl_discount_factor: 0.0
    eval_every: 10
    eval_n: 93
    save_every: 10
    dynamic_sampling_retries: 0
    oversample_factor: 3
    kl_mechanism: loss
    drop_zero_advantage: false
    eval_split: dev
    final_test_eval: true
    warmup_steps: 10
    lr_schedule: cosine
    min_lr_ratio: 0.2
    verl:
      n_gpus: 2
      strategy: fsdp2
      rollout_tp: 2
      checkpoint_dir: /workspace/checkpoints
      gpu_memory_utilization: 0.33
      prompt_length: 8192
      response_length: 2048
      max_token_len_per_gpu: 16384
      extra_overrides:
        - "++actor_rollout_ref.rollout.engine_kwargs.vllm.disable_custom_all_reduce=true"
        - "++actor_rollout_ref.actor.loss_agg_mode=seq-mean-token-mean"
        - "++actor_rollout_ref.actor.optim.clip_grad=0.5"
