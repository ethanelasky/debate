[project]
name = "debate"
version = "0.1.0"
description = "AI debate RL training scaffold: one Backend abstraction, envs on top"
requires-python = ">=3.11"
dependencies = [
    "tinker>=0.21.0",
    "transformers>=4.44",
    "datasets>=2.19",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "openai>=1.0",
    "backoff>=2.0",
    "wandb>=0.18",
    "docent-python>=0.1.74",
]

[project.optional-dependencies]
providers = ["anthropic>=0.30", "google-genai>=1.0"]
logging = ["wandb"]

[project.scripts]
debate-train = "infra.train:main"
debate-rl = "infra.run_debate:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["infra*"]
