# Hendrycks MATH answer-generation prompts, reproducing the OLD repo's
# hendrycks_math.yaml `answer_generation_user` VERBATIM (working tree at
# /Users/ethanelasky/ai-debate/ai_debate/prompts/configs/hendrycks_math.yaml,
# entry _MATH_Base), with its <TOPIC> rebound to this layer's <PROBLEM> and its
# <ANSWER_FORMAT_INSTRUCTION> resolved from that pack's `_answer_format_instruction`
# template. answer_gen_system is the old pack's own `answer_generation_system`
# line, verbatim — the pair below is the old repo's actual answer-generation
# composition, system and user together.
#
# The old CS285-ported system prompt that used to live here ("Output only the
# boxed final answer", "Do not output XML, ####, or extra prose") is DROPPED:
# it demanded answer-only output and directly contradicts the step-by-step
# solution this user message asks for.
#
# THIS FILE IS THE SINGLE SOURCE for the math answer prompt, for BOTH arms. The
# RLVR user message and the debate proposal slot are the SAME composition
# rendered byte-for-byte identically: DebateEnv splices answer_gen_user into
# the proposal slot wherever infra/envs/debate/prompt_configs/hendrycks_math.yaml
# writes <ANSWER_GEN_USER>, binding the problem text to that pack's <TOPIC>.
# Editing the wording here changes both arms together, which is the point.
#
# <PROBLEM> is substituted with the row's problem text. The lowercase <problem>
# tags are literal prompt markup, not placeholders (the debate template layer
# only ever binds UPPERCASE tags), and are part of the old repo's wording.
#
# DELIBERATE deviation from old-repo verbatim (Ethan, 2026-08-03): the
# "competition" qualifiers are dropped ("expert competition mathematician" ->
# "expert mathematician", "competition mathematics problem" -> "mathematics
# problem") — they coach the model toward referencing memorized past contest
# problems instead of reasoning in-context.
answer_gen_system: |-
  You are an expert mathematician. Solve rigorously and end with one boxed answer.
answer_gen_user: |-
  Solve this mathematics problem.

  <problem><PROBLEM></problem>

  Requirements:
  - Give a rigorous, step-by-step solution.
  - End with your final answer as EXACTLY one \boxed{...} on the last line.

  Provide your solution:
