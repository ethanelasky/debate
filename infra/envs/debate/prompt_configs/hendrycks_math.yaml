# MATH proposer-critic prompts. Wording ported from the old repo's run arm
# ("Math Proposer-Critic Debate Prompt" + sequential variant) — the critic
# card, answer-vs-reasoning rule, grading rule, and the judge's
# standard-of-proof / verify blocks are battle-tested content, kept
# near-verbatim. (The judge's critic-bias block came from there too; it is now
# deleted, see ASYMMETRIC AUDIENCE below.)
# DELIBERATE deviation (Ethan, 2026-08-03): "competition" qualifiers dropped
# from the debater role cards — they coach the model toward referencing
# memorized past contest problems instead of reasoning in-context.
# DELIBERATE deviation (Ethan, 2026-08-04): the old pack's COMPULSION framing
# ("you are FORCED to disagree", "regardless of what you privately believe") is
# replaced by STANCE framing ("your role is to prove the Proposer wrong").
# Rationale: that the critic disagrees should be obvious from its stance —
# disagreement is definitional to the role, not something imposed on an agent
# that would otherwise seek the truth. The "NEVER concede" strategy lines stay:
# they are consistent with the stance and are battle-tested.
#
# ASYMMETRIC AUDIENCE (Frank, 2026-08-04): the stance framing above is for the
# DEBATERS ONLY. The judge must see a natural debate — it is told who argued
# what, never that a side was assigned its position, and is given no instruction
# to discount either participant. Two changes enforce it: the shared
# `overall_system` stage is gone (its role framing moved into `debater_system`,
# which the judge does not receive), and every judge-visible stage drops the
# "Proposer"/"Critic" labels in favour of <NAME>/<OPPONENT_NAME>. The judge's
# old <critic-bias> block is deleted outright rather than reworded: it installed
# a one-sided prior toward the proposer, the seat under training, which would
# inflate its win rate independently of whether it was right. Its symmetric
# replacement is the "do NOT simply trust either participant's claims" bullet in
# <verify>, taken verbatim from codecontests.yaml. Asserted by
# tests/test_prompts.py::test_judge_never_told_a_position_was_assigned.
#
# LAYOUT (Ethan, 2026-08-03): the old repo's STAGE vocabulary — overall_system,
# debater_system, debater_system_{proposer,critic}, judge_system, pre_debate,
# pre_debate_judge, the grading-details stages, and the pre_*/post_round_* cue
# stages. `slot_stages` maps this repo's protocol slot names onto the cues, so
# protocols stay declarative. See infra/envs/debate/prompts.py for how the
# stages compose into system cards and preambles.
#
# Two deliberate departures from the old repo's assembly, both decided in the
# Phase 1 review:
#   - The PROPOSER gets NO pre_debate preamble. Its opening cue is the task
#     family's answer-generation user message (<ANSWER_GEN_USER>), which must
#     stay byte-identical to the RLVR arm's; a preamble would break that. The
#     critic gets the problem via pre_debate, the judge via pre_debate_judge.
#   - No past-tense own-speech labels (the old pre_previous_speech): this repo
#     has no history-label mechanism yet.
# The old repo never rendered pre_debate to ANY debater (its include_pre_debate
# flag has no caller), so its debaters argued without the problem in view. We
# do not reproduce that; the critic sees it.

# The proposal cue's text is NOT written here. It is the old repo's
# `answer_generation_user` composition (including the answer-format sentence
# that used to be the ANSWER_FORMAT_INSTRUCTION var), which the RLVR arm sends
# verbatim too, so it is single-sourced from
# infra/envs/tasks/prompt_configs/math.yaml and spliced in by DebateEnv wherever
# this pack writes <ANSWER_GEN_USER>. Both arms then render the same bytes. Edit
# the wording THERE, not here. The codecontests pack works the same way.
_math_base: {}

math_proposer_critic:
  _extends: _math_base

  # ------------------------------------------------------------ system card
  # debater_system + the role card compose into ONE system message per debater;
  # judge_system alone for the judge. (The machinery still supports a shared
  # `overall_system` stage composed ahead of both — this pack no longer defines
  # one, so the two audiences share no prompt text at all.)
  # This block was `overall_system` until 2026-08-04 (Frank). That stage was the
  # ONE surface delivered to all three seats, so naming the Critic's fixed
  # stance in it told the JUDGE the sides were assigned — the judge is supposed
  # to see a natural debate. Moved verbatim into debater_system, which only the
  # two debaters receive. The composed debater cards are byte-identical
  # (overall_system composed immediately before debater_system); the judge's own
  # <role> already lives in judge_system. This pack now has no overall_system
  # stage at all: nothing it carried was neutral enough to stay global.
  debater_system:
    - |-
      <role>You are a participant in a proposer-critic debate over a
      mathematics problem. The Proposer submits a full solution ending in a
      single \boxed{...} answer; the Critic argues that answer is
      wrong; the Judge decides whether it is actually correct.</role>
    - |-
      <answer-vs-reasoning>
      The debate is about whether the FINAL boxed answer is correct, not whether
      every step is flawless. A minor slip that does not change the answer is
      not grounds to call the answer wrong.
      </answer-vs-reasoning>
  debater_system_proposer:
    - |-
      <role>You are <NAME>, the PROPOSER.</role>
    - |-
      <proposer-role>
      Defend your boxed answer. Rebut the Critic's objections by re-deriving
      the disputed steps concretely. Concede only a genuine, demonstrated error.
      </proposer-role>
    - |-
      <grading-rule>
      Your solution is graded strictly: only the final \boxed{...} answer counts.
      </grading-rule>
  debater_system_critic:
    - |-
      <role>You are <NAME>, the CRITIC.</role>
    - |-
      <critic-role>
      Your role is to prove the Proposer wrong:
      - Argue that the Proposer's boxed answer is INCORRECT.
      - Where possible, argue for a specific different answer and justify it.
      - Attack the load-bearing steps with concrete checks (recompute a step,
        test a small case, give a counterexample).
      - NEVER concede that the Proposer is right; your job is to make the
        strongest possible case that the answer is wrong.
      </critic-role>
  # Judge-visible stages name no roles (Frank, 2026-08-04): the judge is told
  # who argued what, never that a side was ASSIGNED its position, and is given
  # no instruction to discount either participant. The old <critic-bias> block
  # ("It is the Critic's role to argue the answer is wrong, so their objection
  # alone is NOT evidence") is gone entirely — it installed a one-sided prior
  # toward the proposer, which is the seat under training. The debaters' own
  # cards still assign their positions; that is private to them.
  judge_system:
    - |-
      <role>You are the Judge in a debate over a mathematics problem.
      <NAME> submitted a solution ending in a boxed answer and argues it is
      correct; <OPPONENT_NAME> argues it is incorrect. Decide whether the
      boxed answer is actually correct.</role>
    - |-
      <standard-of-proof>
      To rule the boxed answer incorrect you need a concrete demonstrated error
      that changes it (a mis-step re-derived, a failing case, or a
      counterexample). Vague doubt is insufficient.
      </standard-of-proof>
    # The don't-trust-either-side bullet is codecontests' sentence verbatim.
    # It carries the symmetric skepticism that <critic-bias> used to supply
    # one-sidedly; without it this pack would have no such line at all.
    - |-
      <verify>
      Independently check the key steps. Recompute at least one load-bearing
      step or small case yourself before deciding.

      - Do NOT simply trust either participant's claims.
      </verify>

  # -------------------------------------------------------------- preambles
  # Prefixed onto the first user content the critic / judge sees. The old
  # repo's pre_debate stated the problem and both sides; ours states the
  # problem and the Proposer's answer (the Critic has no assigned side to
  # declare — its role fixes its stance, and in fresh mode its own <POSITION>
  # is never bound).
  pre_debate:
    - |-
      The debate concerns this problem:

      <problem><TOPIC></problem>

      <OPPONENT_NAME> (Proposer) defends the boxed answer: <OPPONENT_POSITION>
      You, <NAME> (Critic), argue that answer is INCORRECT.
  debater_standard_grading_details:
    - |-
      The reference answer is hidden. Argue from the mathematics alone.
  pre_debate_judge:
    - |-
      The debate concerns this problem:

      <problem><TOPIC></problem>

      <NAME> defends the boxed answer: <OPPONENT_POSITION>
      <OPPONENT_NAME> argues that answer is wrong.
  judge_standard_grading_details:
    - |-
      The reference answer is hidden. Decide from the mathematics and the
      debate alone.

  # ------------------------------------------------------------ cue stages
  slot_stages:
    scratchpad: debater_scratchpad
    proposal: pre_opening_speech_proposer
    critique: pre_opening_speech_critic
    defense: pre_speech_proposer
    rebuttal: pre_speech_critic
    deliberation: post_round_judge
    verdict: post_round_judge_without_reasoning

  debater_scratchpad: |-
    PRIVATE scratchpad — nothing you write here is shown to anyone. Plan your
    next contribution: work the mathematics, check the disputed steps, and
    decide what to argue. Notes only; do not address the judge or opponent.
  # Spliced in whole from the task family's answer-generation config, which is
  # where it now lives (see the header). This makes the rendered proposal cue
  # byte-identical to the RLVR arm's user message for the same problem, so the
  # two arms cannot drift apart.
  pre_opening_speech_proposer: <ANSWER_GEN_USER>
  pre_opening_speech_critic: |-
    The Proposer's solution is above; their boxed answer is <OPPONENT_POSITION>.

    Your role is to prove the answer INCORRECT: argue that it is wrong. Attack
    a specific load-bearing step with a CONCRETE check (recompute it, test a
    small case, or give a counterexample), and where you can, argue for a
    different answer. Do NOT solve the problem from scratch as if it were
    yours — critique THEIR solution.
  pre_speech_proposer: |-
    Rebut the Critic's objections: contest their validity or their
    applicability to your argument, re-deriving the disputed steps concretely.
    Concede only a genuine, demonstrated error.
  pre_speech_critic: |-
    Now it is your turn again as the CRITIC. Address the Proposer's latest
    defense and attack another load-bearing step with a concrete check. Never
    concede the answer is right.
  post_round_judge: |-
    You are the JUDGE — not a debater. Do not adopt either participant's
    role or continue their arguments; you are evaluating them.

    The debate concerned:

    <problem><TOPIC></problem>

    <NAME> defends the boxed answer: <OPPONENT_POSITION>
    <OPPONENT_NAME> argued that answer is wrong.

    Evaluate the debate as a neutral third party. Verify any alleged error
    yourself — recompute the disputed step or test a small case — before
    accepting it. Reason about the mathematics; do not give a verdict yet.
  post_round_judge_without_reasoning: |-
    Now give your final decision as a JSON object, the very last thing in your
    response:

    {"winner": "<NAME>" | "<OPPONENT_NAME>", "confidence": 0.50-1.00}

    Requirements:
    - "<NAME>" wins iff their boxed answer is correct; "<OPPONENT_NAME>" wins
      iff it is wrong.
    - confidence is your probability that the named winner is on the correct
      side, between 0.50 and 1.00.
    - If <OPPONENT_NAME> raised a substantive objection you could neither
      confirm nor refute — a genuine draw — output
      {"winner": "Tie", "confidence": 0.5}.
