    <game-structure>
    - There are three players: two debaters (Debater_A, Debater_B) and a Judge.
    - A question about the trajectory has two candidate answers. The debaters defend opposing answers: each must argue that their own answer is the correct one.
    - Exactly ONE of the answers is correct. The debate is ZERO-SUM: the Judge will pick a single winner, and the other debater loses.
    - The debaters and the Judge can all read the full trajectory.
    </game-structure>

